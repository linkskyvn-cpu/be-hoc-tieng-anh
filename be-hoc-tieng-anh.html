<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bé học tiếng Anh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one-column "sticker book" app — a sky goal strip, then big tappable cards; every screen fits a phone first */
:root{
  --bg:#EAF4FB; --paper:#FFFFFF; --ink:#1D2B3A; --muted:#5B6B7C;
  --sky:#2F8FD8; --sky-ink:#FFFFFF; --sun:#FFC83D; --leaf:#2EAD6B; --berry:#E2486B; --grape:#7A5AE0;
  --line:#CFE0EE; --tile:#F4F9FD; --shadow:0 3px 0 #C3D6E6;
  --f-display:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1B26; --paper:#182836; --ink:#EAF2F9; --muted:#9FB2C4;
  --sky:#4FA8EC; --sky-ink:#0B1520; --sun:#FFD25E; --leaf:#45C584; --berry:#F06A88; --grape:#9C82F0;
  --line:#2A3F52; --tile:#1F3243; --shadow:0 3px 0 #0A131B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1B26; --paper:#182836; --ink:#EAF2F9; --muted:#9FB2C4;
  --sky:#4FA8EC; --sky-ink:#0B1520; --sun:#FFD25E; --leaf:#45C584; --berry:#F06A88; --grape:#9C82F0;
  --line:#2A3F52; --tile:#1F3243; --shadow:0 3px 0 #0A131B; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
input[type=text]{font:inherit;color:var(--ink);background:var(--tile);border:2px solid var(--line);border-radius:14px;padding:10px 12px;width:100%}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;padding-inline:16px;padding-block:0 32px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:16px}
.hello{min-width:0}
.hello small{display:block;color:var(--muted);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.hello h1{font-size:30px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}

.goal{background:var(--sky);color:var(--sky-ink);border-radius:22px;padding:16px 18px;display:grid;gap:10px}
.goal-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.goal h2{font-size:22px}
.bar{height:14px;border-radius:999px;background:color-mix(in srgb,var(--sky-ink) 25%,transparent);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:inherit;transition:width .4s}
.goal .btn{justify-self:start}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:19px;padding:10px 20px;border-radius:16px;background:var(--sun);color:#3A2A00;box-shadow:0 3px 0 #C9951A;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:var(--shadow);border:2px solid var(--line)}
.btn.go{background:var(--leaf);color:#fff;box-shadow:0 3px 0 #1D7A49}
.btn[disabled]{opacity:.45;pointer-events:none}

.section-title{font-size:21px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.section-title span{font-family:var(--f-body);font-size:14px;color:var(--muted);font-weight:700}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.topics.wide{grid-template-columns:repeat(2,minmax(0,1fr))}
.topic{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:14px;text-align:left;display:grid;gap:4px;align-content:start;box-shadow:var(--shadow);transition:transform .08s}
.topic:active{transform:translateY(2px)}
.topic .pic{font-size:38px;line-height:1}
.topic b{font-family:var(--f-display);font-size:19px}
.topic small{color:var(--muted);font-weight:700}
.topic.phonics{border-color:color-mix(in srgb,var(--grape) 45%,var(--line))}
.topic.phonics .pic{font-family:var(--f-display);font-weight:800;color:var(--grape)}
.topic.mine{border-style:dashed}
.topic{position:relative}
.topic.current{border-color:var(--sun);box-shadow:0 3px 0 #C9951A}
.now{position:absolute;top:10px;right:10px;background:var(--sun);color:#3A2A00;font-weight:800;font-size:12px;border-radius:999px;padding:2px 8px}
.topics.units{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:520px){.topics.units{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bubble{border-radius:18px;padding:8px 16px;font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.2;max-width:100%;overflow-wrap:anywhere}
.bubble.q{background:var(--tile);color:var(--muted);font-size:22px}
.bubble.a{background:color-mix(in srgb,var(--sky) 14%,var(--paper));color:var(--ink)}
.sline{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:flex-end;min-height:52px}
.wslot{min-width:64px;height:46px;border-bottom:4px solid var(--line);font-family:var(--f-display);font-size:26px;font-weight:800;display:flex;align-items:flex-end;justify-content:center;padding-inline:4px}
.wslot.fill{border-color:var(--sky)}
.punct{font-family:var(--f-display);font-size:28px;font-weight:800}
.tile.wtile{width:auto;min-width:64px;padding-inline:14px;font-size:24px}
.sel{font:inherit;color:var(--ink);background:var(--tile);border:2px solid var(--line);border-radius:14px;padding:10px 12px;width:100%}
.mini{height:8px;border-radius:999px;background:var(--tile);overflow:hidden;margin-top:4px}
.mini i{display:block;height:100%;background:var(--leaf)}
.badge-done{color:var(--leaf)!important}

.badges{display:flex;flex-wrap:wrap;gap:8px}
.medal{display:flex;align-items:center;gap:6px;background:var(--paper);border:2px dashed var(--line);border-radius:14px;padding:6px 10px;font-weight:700;font-size:15px;color:var(--muted)}
.medal.on{border-style:solid;border-color:var(--sun);color:var(--ink)}
.parent-link{justify-self:center;align-self:center}

.bar-head{display:flex;align-items:center;gap:10px;padding-top:16px}
.bar-head h2{font-size:22px;min-width:0}
.bar-head .count{margin-left:auto;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.back{width:44px;height:44px;border-radius:14px;background:var(--paper);border:2px solid var(--line);font-size:22px;flex:none}
.progress{flex:1;min-width:60px;height:12px;border-radius:999px;background:var(--paper);border:2px solid var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--leaf);transition:width .3s}

.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mode{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:16px;text-align:left;box-shadow:var(--shadow);display:grid;gap:4px;align-content:start}
.mode .pic{font-size:34px}
.wide-mode{border-color:color-mix(in srgb,var(--grape) 45%,var(--line))}
.az{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;width:100%}
.azc{display:grid;justify-items:center;gap:0;background:var(--tile);border:3px solid var(--line);border-radius:16px;padding:6px 4px 8px;transition:transform .15s,border-color .15s}
.azc b{font-family:var(--f-display);font-size:32px;line-height:1.05;color:var(--grape)}
.azc b i{font-style:normal;font-size:.75em;color:var(--sky);margin-left:2px}
.azc span{font-size:26px;line-height:1.2}
.azc small{font-weight:800;font-size:12px;color:var(--muted)}
.azc.on{border-color:var(--berry);transform:scale(1.08);background:color-mix(in srgb,var(--sun) 25%,var(--tile))}
.mode b{font-family:var(--f-display);font-size:20px}
.mode small{color:var(--muted);font-weight:700;font-size:14px}

.stage{background:var(--paper);border:2px solid var(--line);border-radius:26px;padding:22px 18px;display:grid;gap:16px;justify-items:center;text-align:center;box-shadow:var(--shadow)}
.big-pic{font-size:96px;line-height:1.05;min-height:100px}
.big-pic.num{font-family:var(--f-display);font-weight:800;color:var(--grape)}
.big-pic.txt{font-family:var(--f-display);font-weight:800;font-size:56px;color:var(--grape)}
.letter{font-family:var(--f-display);font-weight:800;font-size:110px;line-height:1;color:var(--grape)}
.letter small{font-size:.55em;color:var(--sky)}
.word{font-family:var(--f-display);font-size:44px;font-weight:800;letter-spacing:.01em;overflow-wrap:anywhere}
.word mark{background:none;color:var(--berry)}
.vi{color:var(--muted);font-weight:800;font-size:19px}
.sentence{background:var(--tile);border-radius:14px;padding:8px 14px;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.say{width:76px;height:76px;border-radius:50%;background:var(--sky);color:var(--sky-ink);font-size:34px;box-shadow:0 4px 0 color-mix(in srgb,var(--sky) 60%,#000)}
.say.small{width:52px;height:52px;font-size:22px}
.prompt{font-family:var(--f-display);font-size:22px;font-weight:700;background:var(--tile);border-radius:18px;padding:6px 16px}

.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%}
.choices.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.choice{background:var(--tile);border:3px solid var(--line);border-radius:20px;padding:12px;font-size:58px;line-height:1.1;min-height:96px;overflow-wrap:anywhere}
.choice.num,.choice.txt{font-family:var(--f-display);font-weight:800;color:var(--grape)}
.choice.txt{font-size:34px}
.choice.right{border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 18%,var(--tile))}
.choice.wrong{border-color:var(--berry);background:color-mix(in srgb,var(--berry) 15%,var(--tile));animation:shake .35s}

.slots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.slot{width:40px;height:52px;border-bottom:4px solid var(--line);font-family:var(--f-display);font-size:34px;font-weight:800;display:flex;align-items:flex-end;justify-content:center}
.slot.fill{border-color:var(--sky)}
.slot.given{border-color:transparent;color:var(--muted)}
.slot.gap{width:14px;border:0}
.tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tile{width:56px;height:60px;border-radius:14px;background:var(--sun);color:#3A2A00;font-family:var(--f-display);font-size:32px;font-weight:800;box-shadow:0 3px 0 #C9951A}
.tile.used{visibility:hidden}

.blend{display:flex;gap:10px;justify-content:center}
.btile{display:grid;justify-items:center;gap:2px;background:var(--tile);border:3px solid var(--line);border-radius:18px;padding:6px 14px 8px;min-width:72px;transition:transform .15s,border-color .15s}
.btile b{font-family:var(--f-display);font-size:56px;line-height:1;color:var(--ink)}
.btile small{font-size:22px}
.btile.on{border-color:var(--berry);transform:translateY(-6px)}
.btile.on b{color:var(--berry)}
.cover{width:120px;height:110px;border-radius:22px;background:var(--tile);border:3px dashed var(--line);font-size:44px;font-family:var(--f-display);font-weight:800;color:var(--muted)}

.feedback{min-height:30px;font-family:var(--f-display);font-size:24px;font-weight:800}
.feedback.ok{color:var(--leaf)}
.feedback.no{color:var(--berry)}
.hint{color:var(--muted);font-size:15px;font-weight:700;max-width:44ch}

.result .big-pic{font-size:80px}
.stars-row{font-size:40px;letter-spacing:4px}
.list{display:grid;gap:6px;width:100%;text-align:left}
.list>div{display:flex;gap:10px;align-items:center;background:var(--tile);border-radius:12px;padding:6px 12px;font-weight:700;min-width:0}
.list>div .r{margin-left:auto;color:var(--muted)}

.panel{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:18px;display:grid;gap:12px}
.panel h3{font-size:20px}
.panel label{font-weight:800}
textarea,.emo{font:inherit;color:var(--ink);background:var(--tile);border:2px solid var(--line);border-radius:14px;padding:10px 12px;width:100%}
textarea{min-height:130px;resize:vertical}
.emo{width:56px;text-align:center;font-size:24px;padding:4px}
.cw{display:flex;gap:10px;align-items:center;background:var(--tile);border-radius:14px;padding:6px 8px}
.cw .t{min-width:0;flex:1}
.cw .t b{display:block;font-family:var(--f-display);font-size:19px;overflow-wrap:anywhere}
.cw .t span{color:var(--muted);font-weight:700}
.del{width:40px;height:40px;border-radius:12px;background:var(--paper);border:2px solid var(--line);font-size:18px;flex:none}
.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--tile);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-weight:700;font-size:13px}

.pop{animation:pop .4s}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.foot{color:var(--muted);font-size:13px;text-align:center}
@media (max-width:380px){.word{font-size:36px}.big-pic{font-size:80px}.slot{width:32px}.tile{width:48px}.btile{min-width:60px;padding-inline:8px}.btile b{font-size:46px}.letter{font-size:90px}}
</style>
</head>

 ["hen","con gà mái","🐔"],["ten","số mười","10"],["fox","con cáo","🦊"],["box","cái hộp","📦"],["pen","cái bút","🖊️"],["net","cái lưới","🥅"]];

// Chủ đề theo danh sách từ Cambridge Pre A1 Starters: [english, tiếng Việt, hình, câu mẫu]
const TOPICS = [
 {id:"animals", name:"Con vật", en:"Animals", pic:"🐯", words:[
  ["cat","con mèo","🐱","I like the cat."],["dog","con chó","🐶","I like the dog."],["bird","con chim","🐦","The bird can fly."],["fish","con cá","🐟","The fish can swim."],

  ["orange","màu cam","🟠","My ball is orange."],["purple","màu tím","🟣","The grapes are purple."],["brown","màu nâu","🟤","The horse is brown."],["black","màu đen","⚫","My cat is black."],["white","màu trắng","⚪","The milk is white."]]},

 {id:"food", name:"Đồ ăn", en:"Food", pic:"🍎", words:[
  ["apple","quả táo","🍎","I eat an apple."],["banana","quả chuối","🍌","I like bananas."],["orange","quả cam","🍊","I like oranges."],["grapes","quả nho","🍇","The grapes are sweet."],
  ["cake","bánh ngọt","🎂","I like cake."],["carrot","cà rốt","🥕","The rabbit eats a carrot."],["egg","quả trứng","🥚","I have an egg."],["milk","sữa","🥛","I drink milk."],

 {id:"toys", name:"Đồ chơi", en:"Toys", pic:"🧸", words:[
  ["ball","quả bóng","⚽","I have a ball."],["doll","búp bê","🪆","This is my doll."],["kite","cái diều","🪁","I fly my kite."],["car","ô tô","🚗","I have a red car."],
  ["bike","xe đạp","🚲","I ride my bike."],["boat","con thuyền","⛵","The boat is on the water."],["robot","rô-bốt","🤖","I have a robot."],["teddy","gấu bông","🧸","I love my teddy."],["train","tàu hoả","🚆","The train is long."]]},

let enVoice=null, viVoice=null;
function pickVoices(){ try{ const all=speechSynthesis.getVoices(); const en=all.filter(v=>/^en[-_]/i.test(v.lang));
  enVoice=en.find(v=>/en[-_]US/i.test(v.lang)&&/female|samantha|google/i.test(v.name))||en.find(v=>/en[-_]US/i.test(v.lang))||en[0]||null;
  viVoice=all.find(v=>/^vi/i.test(v.lang))||null; }catch(e){} }
try{ pickVoices(); speechSynthesis.onvoiceschanged=pickVoices; }catch(e){}
// parts: [text, "en"|"vi", slow?]; tiếng Việt chỉ đọc khi máy có giọng Việt
function utter(text,lang,slow){
  if(lang==="vi"&&!viVoice) return null;
  const u=new SpeechSynthesisUtterance(text); u.lang=lang==="vi"?"vi-VN":"en-US"; const v=lang==="vi"?viVoice:enVoice; if(v) u.voice=v;
  u.rate=slow?0.5:(lang==="vi"?1:0.75); if(lang==="en") u.pitch=1.1; return u;
}
let speechToken=0;
function stopSpeech(){ speechToken++; try{ speechSynthesis.cancel(); }catch(e){} }
function say(parts){
  stopSpeech();
  try{ parts.forEach(p=>{ if(!p||!p[0]) return; const u=utter(p[0],p[1],p[2]); if(u) speechSynthesis.speak(u); }); }catch(e){}
}
// Đọc từng phần một, nghỉ `gap` ms giữa các phần cho khỏi dính liền nhau
function sayPaced(parts,{gap=900,onStep,onDone}={}){
  stopSpeech(); const my=speechToken; let k=0;
  const next=()=>{
    if(my!==speechToken) return;
    if(k>=parts.length){ onDone&&onDone(); return; }
    const [text,lang,slow,tag]=parts[k++]; onStep&&onStep(tag);
    let fired=false; const go=()=>{ if(fired||my!==speechToken) return; fired=true; setTimeout(next,gap); };
    try{ const u=utter(text,lang,slow); if(!u) return go(); u.onend=go; u.onerror=go; speechSynthesis.speak(u);
      setTimeout(go,1600+text.length*(slow?320:180)); }catch(e){ go(); }
  };
  next();
}
// Tên chữ cái viết theo cách đọc, để giọng máy không đọc "a" thành "ơ"
const LETTER_NAME={a:"ay",b:"bee",c:"see",d:"dee",e:"ee",f:"eff",g:"gee",h:"aitch",i:"eye",j:"jay",k:"kay",l:"el",m:"em",n:"en",o:"oh",p:"pee",q:"cue",r:"ar",s:"ess",t:"tee",u:"you",v:"vee",w:"double you",x:"ex",y:"why",z:"zee"};
const speak=(t,slow)=>say([[t,"en",slow]]);
let actx=null;
function chime(ok){
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const notes=ok?[660,880,1175]:[300,220];
    notes.forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type="triangle"; o.frequency.value=f; const t=actx.currentTime+i*0.11;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.18,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.22); o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.25); });
  }catch(e){}
}

function alphabet(){
  const AZ=[...ABC.list].sort((a,b)=>a.en.localeCompare(b.en));
  let slow=false, playing=false;
  $app.innerHTML=`${head("Bảng chữ cái A–Z")}
  <div class="stage">
    <div class="row"><button class="btn go" id="all">▶ Đọc cả bảng</button><button class="btn ghost" id="speed" aria-pressed="false">🐇 Bình thường</button></div>
    <div class="az" id="az">${AZ.map((w,i)=>`<button class="azc" data-i="${i}" aria-label="${w.en.toUpperCase()}, ${esc(w.kw)}"><b>${w.en.toUpperCase()}<i>${w.en}</i></b><span>${esc(w.pic)}</span><small>${esc(w.kw)}</small></button>`).join("")}</div>

  </div>`;
  bindBack(abcMenu);
  const cells=[...$app.querySelectorAll(".azc")];
  const mark=i=>{ cells.forEach(c=>c.classList.remove("on")); if(i!=null&&cells[i]){ cells[i].classList.add("on"); cells[i].scrollIntoView({block:"nearest",behavior:"smooth"}); } };
  const setPlaying=p=>{ playing=p; $("all").textContent=p?"⏹ Dừng":"▶ Đọc cả bảng"; if(!p) mark(null); };
  const gap=()=>slow?1300:800;
  cells.forEach(c=>c.onclick=()=>{ const i=+c.dataset.i, w=AZ[i]; setPlaying(false); mark(i);
    sayPaced([[LETTER_NAME[w.en],"en",slow],[w.kw,"en",slow]],{gap:gap(),onDone:()=>mark(null)}); });
  $("all").onclick=()=>{
    if(playing){ stopSpeech(); return setPlaying(false); }
    setPlaying(true);
    const parts=AZ.flatMap((w,i)=>[[LETTER_NAME[w.en],"en",slow,i],[w.kw,"en",slow,i]]);
    sayPaced(parts,{gap:gap(),onStep:mark,onDone:()=>setPlaying(false)});
  };
  $("speed").onclick=()=>{ slow=!slow; $("speed").textContent=slow?"🐢 Chậm":"🐇 Bình thường"; $("speed").setAttribute("aria-pressed",slow); };
}

  let timer=null;
  $("blend").onclick=()=>{
    clearTimeout(timer); let k=0;
    const step=()=>{ tiles.forEach(t=>t.classList.remove("on")); if(k<tiles.length){ tiles[k].classList.add("on"); k++; timer=setTimeout(step,550); } else { tiles.forEach(t=>t.classList.add("on")); say([[w.en,"en",true],[w.en,"en"]]); timer=setTimeout(()=>tiles.forEach(t=>t.classList.remove("on")),1800); } };
    step();

  $("prev").onclick=()=>{ clearTimeout(timer); blendCard(list,i-1); };

function sentenceQ(w,i,n,done,exit,intro){
  const punct=(w.en.match(/[.!?]$/)||[""])[0];
  const parts=w.en.replace(/[.!?]$/,"").split(/\s+/);
  let tiles=shuffle(parts.map(c=>({c})));
  if(tiles.length>1 && tiles.map(x=>x.c).join(" ")===parts.join(" ")) tiles.reverse();
  let typed=[];
  const text="Nghe rồi xếp từ thành câu";
  $app.innerHTML=`${head("",i,n)}
  <div class="stage">${promptHtml(text)}
    <div class="big-pic">${esc(w.pic)}</div>
    ${w.q?`<div class="bubble q">🙋 ${esc(w.q)}</div>`:""}
    <div class="row"><button class="say small" id="say" aria-label="Nghe">🔊</button><button class="btn ghost" id="undo">⌫ Xoá</button></div>
    <div class="sline" id="sline"></div><div class="tiles" id="tiles"></div>
    <div class="feedback" id="fb" aria-live="polite"></div></div>`;
  bindBack(exit);
  const play=()=>sayPaced([w.q?[w.q,"en"]:null,[w.en,"en"]].filter(Boolean),{gap:800});
  $("pr").onclick=()=>sayPaced([[text,"vi"],w.q?[w.q,"en"]:null,[w.en,"en"]].filter(Boolean),{gap:700});
  setTimeout(()=> intro ? $("pr").onclick() : play(), 250);
  $("say").onclick=play;
  const sl=$("sline"), tl=$("tiles"), fb=$("fb");
  let finished=false, tries=0;
  const draw=()=>{
    sl.innerHTML=parts.map((_,k)=>typed[k]?`<span class="wslot fill">${esc(typed[k].c)}</span>`:`<span class="wslot"></span>`).join("")+(punct?`<span class="punct">${punct}</span>`:"");
    tl.innerHTML=tiles.map((x,k)=>`<button class="tile wtile ${typed.includes(x)?"used":""}" data-k="${k}">${esc(x.c)}</button>`).join("");
    tl.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{ if(finished) return; const x=tiles[+b.dataset.k]; if(typed.includes(x)) return; typed.push(x); speak(x.c); draw(); if(typed.length===parts.length) check(); });
  };
  const check=()=>{
    if(typed.map(x=>x.c).join(" ")===parts.join(" ")){ finished=true; fb.className="feedback ok"; fb.textContent=`⭐ ${pick(praiseVi)}`; sl.classList.add("pop"); chime(true); setTimeout(()=>speak(w.en),300); done(tries===0); }
    else { tries++; chime(false);
      if(tries>=2){ finished=true; fb.className="feedback no"; fb.textContent="Câu đúng là:"; typed=parts.map(c=>({c})); draw(); setTimeout(()=>speak(w.en),300); done(false); }
      else { fb.className="feedback no"; fb.textContent="Gần đúng rồi, thử lại nhé!"; setTimeout(()=>{ if(finished) return; typed=[]; draw(); fb.textContent=""; },1000); }
    }
  };
  $("undo").onclick=()=>{ if(!finished){ typed.pop(); draw(); } };
  draw();
}
function pickSession(words,n){
  // ưu tiên từ chưa thuộc
  const sorted=shuffle(words).sort((a,b)=>W(a.key).box-W(b.key).box);
  return shuffle(sorted.slice(0,n));
}

  const w=words[i];

    <div class="row"><button class="btn ghost" id="prev" ${i?"":"disabled"}>← Trước</button><button class="btn go" id="next">${i<words.length-1?"Tiếp →":"Chơi luôn! 🎮"}</button></div>
  </div>`;
  bindBack(()=>menuFor(t));
  $("s1").onclick=()=>speak(w.en);
  $("s2").onclick=()=>speak(w.en,true);
  if(w.ex) $("s3").onclick=()=>speak(w.ex);
  $("prev").onclick=()=>cards(t,words,i-1);
  $("next").onclick=()=> i<words.length-1 ? cards(t,words,i+1) : runQuiz(pickSession(words,8).map(w=>({w,mode:"listen"})),()=>menuFor(t),t);
  speak(w.en);
}

// ---------- quiz engine ----------
function runQuiz(items, onExit, t){
  if(!items.length) return onExit();
  const results=[]; let i=0, lastMode=""; const sid=++quizSeq;
  const modes={listen:listenQ,spell:spellQ,speak:speakQ,first:firstQ,read:readQ,sentence:sentenceQ};
  const next=()=>{ if(i>=items.length) return result(results,onExit,t,items);
    const it=items[i]; const intro=it.mode!==lastMode; lastMode=it.mode;
    const done=ok=>{ grade(it.w.key,ok); results.push({w:it.w,ok}); i++; setTimeout(()=>{ if(sid===quizSeq) next(); }, ok?1000:1800); };
    modes[it.mode](it.w,i,items.length,done,onExit,intro); };
  next();
}
// Chấm câu trắc nghiệm chung cho các trò chọn đáp án
function answerChoices(w, done, wrongMsg, after){
  let answered=false;
  $app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
    if(answered) return; answered=true;
    const ok=b.dataset.k===w.key, fb=$("fb");
    if(ok){ b.classList.add("right","pop"); fb.className="feedback ok"; fb.textContent=`⭐ ${pick(praiseVi)}`; chime(true); }
    else { b.classList.add("wrong"); $app.querySelector(`.choice[data-k="${CSS.escape(w.key)}"]`)?.classList.add("right"); fb.className="feedback no"; fb.textContent=wrongMsg(); chime(false); }
    setTimeout(after,300);
    done(ok);
  });
}
function listenQ(w,i,n,done,exit,intro){
  let pool=w.topic.list.filter(x=>x.key!==w.key);
  if(pool.length<3) pool=pool.concat(shuffle(TOPICS.flatMap(t=>t.list)).filter(x=>x.en!==w.en).slice(0,3-pool.length));
  const opts=shuffle([w,...shuffle(pool).slice(0,3)]);
  const text="Nghe và chọn hình đúng";
  $app.innerHTML=`${head("",i,n)}
  <div class="stage">${promptHtml(text)}
    <button class="say" id="say" aria-label="Nghe lại">🔊</button>
    <div class="choices">${opts.map(o=>`<button class="choice${!o.pic?" txt":isNumPic(o.pic)?" num":""}" data-k="${o.key}" aria-label="${esc(o.vi||o.en)}">${esc(o.pic||o.en)}</button>`).join("")}</div>
    <div class="feedback" id="fb" aria-live="polite"></div></div>`;
  bindBack(exit); bindPrompt(text,w.en,intro);
  $("say").onclick=()=>speak(w.en);
  answerChoices(w, done, ()=>`Chưa đúng. Đây mới là "${w.en}"`, ()=>say([[w.en,"en"]]));
}
function spellQ(w,i,n,done,exit,intro){
  const letters=w.en.split("");
  const idxs=letters.map((c,k)=>/[a-z]/i.test(c)?k:-1).filter(k=>k>=0);
  // Bé lớp 1: từ dài hơn 4 chữ thì hiện sẵn chữ đầu và vài chữ, chỉ để trống 4 ô
  let hide=idxs;
  if(idxs.length>4) hide=shuffle(idxs.slice(1)).slice(0,4).sort((a,b)=>a-b);
  const hidden=new Set(hide);
  let tiles=shuffle(hide.map(k=>({c:letters[k]})));
  if(tiles.length>2 && tiles.map(x=>x.c).join("")===hide.map(k=>letters[k]).join("")) tiles.reverse();
  let typed=[];
  const text="Xếp chữ cái thành từ";
  $app.innerHTML=`${head("",i,n)}
  <div class="stage">${promptHtml(text)}
    ${picHtml(w)}${w.vi?`<div class="vi">${esc(w.vi)}</div>`:""}
    <div class="row"><button class="say small" id="say" aria-label="Nghe">🔊</button><button class="btn ghost" id="undo">⌫ Xoá</button></div>
    <div class="slots" id="slots"></div><div class="tiles" id="tiles"></div>
    <div class="feedback" id="fb" aria-live="polite"></div></div>`;
  bindBack(exit); bindPrompt(text,w.en,intro);
  const slots=$("slots"), tl=$("tiles"), fb=$("fb");
  let finished=false, tries=0;
  const draw=()=>{
    let t=0;
    slots.innerHTML=letters.map((c,k)=>{ if(c===" ") return `<span class="slot gap"></span>`; if(!hidden.has(k)) return `<span class="slot given">${esc(c)}</span>`; const v=typed[t++]; return `<span class="slot ${v?"fill":""}">${v?esc(v.c):""}</span>`; }).join("");
    tl.innerHTML=tiles.map((x,k)=>`<button class="tile ${typed.includes(x)?"used":""}" data-k="${k}">${esc(x.c)}</button>`).join("");
    tl.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{ if(finished) return; const x=tiles[+b.dataset.k]; if(typed.includes(x)) return; typed.push(x); draw(); if(typed.length===hide.length) check(); });
  };
  const check=()=>{
    const ok=typed.every((x,k)=>x.c===letters[hide[k]]);
    if(ok){ finished=true; fb.className="feedback ok"; fb.textContent=`⭐ ${pick(praiseVi)}`; slots.classList.add("pop"); chime(true); speak(w.en); done(tries===0); }
    else { tries++; chime(false);
      if(tries>=2){ finished=true; fb.className="feedback no"; fb.textContent=`Đáp án: ${w.en}`; typed=hide.map(k=>({c:letters[k]})); draw(); speak(w.en); done(false); }
      else { fb.className="feedback no"; fb.textContent="Gần đúng rồi, thử lại nhé!"; setTimeout(()=>{ if(finished) return; typed=[]; draw(); fb.textContent=""; },900); }
    }
  };
  $("say").onclick=()=>speak(w.en,true);
  $("undo").onclick=()=>{ if(!finished){ typed.pop(); draw(); } };
  draw();
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let micBlocked=!SR;
function speakQ(w,i,n,done,exit,intro){
  const text="Nghe rồi đọc to theo nhé";
  $app.innerHTML=`${head("",i,n)}
  <div class="stage">${promptHtml(text)}
    ${picHtml(w)}<div class="word">${esc(w.en)}</div>${w.vi?`<div class="vi">${esc(w.vi)}</div>`:""}
    <div class="row"><button class="say small" id="say" aria-label="Nghe">🔊</button><button class="say small" id="slow" aria-label="Đọc chậm">🐢</button></div>
    <div class="row" id="act"></div>
    <div class="feedback" id="fb" aria-live="polite"></div>
    <p class="hint" id="hint"></p></div>`;
  bindBack(exit); bindPrompt(text,w.en,intro);
  const fb=$("fb"), act=$("act"), hint=$("hint");
  $("say").onclick=()=>speak(w.en);
  $("slow").onclick=()=>speak(w.en,true);
  let finished=false;
  const finish=(ok,msg)=>{ if(finished) return; finished=true; act.innerHTML=""; fb.className="feedback "+(ok?"ok":"no"); fb.textContent=msg; chime(ok); done(ok); };
  const selfCheck=()=>{
    hint.textContent="Con đọc to từ trên 2–3 lần, rồi bấm nút bên dưới. Bố mẹ nghe giúp con nhé!";
    act.innerHTML=`<button class="btn go" id="yes">😀 Con đọc được rồi</button><button class="btn ghost" id="no">🤔 Còn khó</button>`;
    $("yes").onclick=()=>finish(true,`⭐ ${pick(praiseVi)}`);
    $("no").onclick=()=>{ speak(w.en,true); finish(false,"Không sao, mình sẽ ôn lại từ này sau!"); };
  };
  if(micBlocked) return selfCheck();
  act.innerHTML=`<button class="btn go" id="mic">🎤 Bấm rồi nói</button>`;
  hint.textContent="Bấm nút, rồi nói to từ tiếng Anh ở trên.";
  let tries=0;
  $("mic").onclick=()=>{
    let rec; try{ rec=new SR(); }catch(e){ micBlocked=true; return selfCheck(); }
    rec.lang="en-US"; rec.maxAlternatives=5; rec.interimResults=false;
    fb.className="feedback"; fb.textContent="👂 Đang nghe…";
    let heard=false;
    const norm=s=>" "+s.toLowerCase().replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim()+" ";
    rec.onresult=e=>{ heard=true; const alts=[...e.results[0]].map(a=>a.transcript);
      if(alts.some(a=>norm(a).includes(norm(w.en)))) finish(true,`⭐ ${pick(praiseVi)} Con nói rất chuẩn!`);
      else { tries++; if(tries>=3) finish(false,`Máy nghe là "${alts[0]}". Mình ôn lại sau nhé!`); else { fb.className="feedback no"; fb.textContent=`Máy nghe là "${alts[0]}". Thử lại nhé!`; speak(w.en,true); } } };
    rec.onerror=e=>{ if(["not-allowed","service-not-allowed","audio-capture"].includes(e.error)){ micBlocked=true; fb.textContent=""; selfCheck(); hint.textContent="Máy chưa cho dùng micro. Bố mẹ bấm biểu tượng micro trên thanh địa chỉ để cho phép, rồi tải lại trang. Tạm thời con tự chấm nhé!"; } else { fb.className="feedback no"; fb.textContent="Chưa nghe rõ, bấm nói lại nhé!"; } };
    rec.onend=()=>{ if(!heard && !finished && !micBlocked && fb.textContent==="👂 Đang nghe…"){ fb.className="feedback no"; fb.textContent="Chưa nghe rõ, bấm nói lại nhé!"; } };
    try{ rec.start(); }catch(e){ micBlocked=true; selfCheck(); }
  };
}

// ---------- review & results ----------
function review(){
  const keys=shuffle(dueKeys()).slice(0,10);
  const rot=["listen","spell","listen","speak"];
  runQuiz(keys.map((k,idx)=>{ const w=WORDS[k]; const mode=w.isSent?"sentence":w.topic.kind==="abc"?"first":w.topic.kind==="cvc"?"read":rot[idx%rot.length]; return {w,mode}; }), home, null);
}
function result(results,onExit,t,items){
  const right=results.filter(r=>r.ok).length, n=results.length;
  const ratio=n?right/n:0;
  const stars=ratio>=.9?3:ratio>=.6?2:ratio>0?1:0;
  const wrong=results.filter(r=>!r.ok);
  $app.innerHTML=`${head("Kết quả")}
  <div class="stage result">
    <div class="big-pic pop">${stars===3?"🏆":stars===2?"🎉":"💪"}</div>
    <h2>${stars===3?`Xuất sắc, ${KID}!`:stars===2?"Giỏi lắm!":"Cố lên, lần sau sẽ tốt hơn!"}</h2>
    <div class="stars-row" aria-label="${stars} sao">${"⭐".repeat(stars)}${"☆".repeat(3-stars)}</div>
    <p><b>${right}/${n}</b> câu đúng · nhận <b>${right} ⭐</b></p>
    ${wrong.length?`<div class="list">${wrong.map(r=>`<div><span>${esc(r.w.pic||"⭐")}</span><b>${esc(r.w.kw||r.w.en)}</b><span class="r">${esc(r.w.vi||"chữ "+r.w.en)}</span></div>`).join("")}</div><p class="hint">Những từ này sẽ tự quay lại trong phần ôn tập.</p>`:""}
    <div class="row"><button class="btn ghost" id="again">🔁 Chơi lại</button><button class="btn go" id="out">${t?"Chọn trò khác":"Về trang chính"}</button></div>
  </div>`;
  say([[stars===3?"Xuất sắc! Con giỏi lắm!":stars===2?"Giỏi lắm!":"Cố lên nhé!","vi"],[stars===3?"Excellent! You are a star!":"Good job!","en"]]);
  bindBack(onExit);
  $("out").onclick=onExit;
  $("again").onclick=()=>runQuiz(shuffle(items),onExit,t);
}

// ---------- parent corner ----------
function guessPic(en){
  const all=[...TOPICS.flatMap(t=>t.list),...UNITS.flatMap(u=>unitDefault(u)),...BLEND.list];
  const f=x=>all.find(w=>w.en===x)?.pic||EMOJI_HINT[x];
  return f(en) || f(en.replace(/(es|s)$/,"")) || "";
}
function parent(){
  const learned=[...UNITS,...TOPICS,MINE,BLEND,ABC].reduce((a,t)=>a+mastered(t),0);
  const hard=Object.entries(S.words).filter(([k,v])=>WORDS[k]&&v.wrong>0).sort((a,b)=>b[1].wrong-a[1].wrong).slice(0,6);
  $app.innerHTML=`${head("Góc bố mẹ")}
  <div class="panel">
    <h3>Tiến độ của ${KID}</h3>
    <div class="stat-grid"><div class="stat"><b>${learned}</b><span>từ / chữ đã thuộc</span></div><div class="stat"><b>${S.stars}</b><span>sao</span></div><div class="stat"><b>${S.streak||0}</b><span>ngày liên tục</span></div></div>
    ${hard.length?`<label>Từ bé hay sai</label><div class="list">${hard.map(([k,v])=>{const w=WORDS[k]; return `<div><span>${esc(w.pic||"⭐")}</span><b>${esc(w.kw||w.en)}</b><span class="r">sai ${v.wrong} lần</span></div>`}).join("")}</div>`:`<p class="hint">Chưa có từ nào bé làm sai.</p>`}
  </div>
  <div class="panel">
    <h3>Tên và sao lưu</h3>
    <label for="kid-rename">Tên của bé</label>
    <input type="text" id="kid-rename" maxlength="30" value="${esc(KID)}" autocomplete="off">
    <p class="hint">Tiến độ chỉ lưu trong trình duyệt của máy này. Thỉnh thoảng bố mẹ bấm "Tải bản sao lưu" để giữ một bản, khi đổi máy hoặc xoá dữ liệu trình duyệt thì bấm "Khôi phục".</p>
    <div class="row" style="justify-content:flex-start"><button class="btn ghost" id="bk-save">💾 Tải bản sao lưu</button><label class="btn ghost" for="bk-load">📂 Khôi phục</label><input type="file" id="bk-load" accept="application/json,.json" hidden></div>
    <p class="hint" id="bk-msg"></p>
  </div>
  <div class="panel">
    <h3>Sửa và thêm từ</h3>
    <label for="cw-target">Danh sách từ</label>
    <select id="cw-target" class="sel"><option value="custom">⭐ My words (từ bố mẹ thêm)</option>${UNITS.map(u=>`<option value="${u.id}">📘 ${esc(u.en)}: ${esc(u.name)}</option>`).join("")}</select>
    <label for="cw-bulk">Mỗi dòng một từ: tiếng Anh – nghĩa tiếng Việt</label>
    <textarea id="cw-bulk" placeholder="sheep - con cừu&#10;rain - trời mưa&#10;happy - vui vẻ"></textarea>
    <div class="row" style="justify-content:flex-start"><button class="btn go" id="cw-add">➕ Thêm từ</button><button class="btn ghost" id="cw-reset" hidden>↺ Về danh sách gợi ý</button></div>
    <p class="hint" id="cw-msg">App tự tìm hình cho các từ quen thuộc. Từ nào chưa có hình, bố mẹ dán một emoji vào ô bên trái (hoặc để trống, app sẽ hiện chữ).</p>
    <div class="list" id="cw-list"></div>
  </div>`;
  bindBack(home);
  $("kid-rename").onchange=()=>{ const n=$("kid-rename").value.trim(); if(n){ setKid(n); $("bk-msg").textContent="Đã đổi tên."; } };
  $("bk-save").onclick=()=>{
    const blob=new Blob([JSON.stringify({app:"be-hoc-tieng-anh",name:KID,state:S},null,1)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`tieng-anh-sao-luu-${today()}.json`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000); $("bk-msg").textContent="Đã tải bản sao lưu vào thư mục Tải về.";
  };
  $("bk-load").onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{ const d=JSON.parse(await f.text()); if(!d||d.app!=="be-hoc-tieng-anh"||!d.state) throw 0;
      S=Object.assign({stars:0,words:{},day:"",doneToday:0,streak:0,lastDay:"",updated:0,custom:[],unitWords:{},curUnit:"u1"},d.state); fixState(); if(d.name) setKid(d.name);
      buildWords(); save(); parent(); $("bk-msg").textContent="Đã khôi phục tiến độ."; }
    catch(err){ $("bk-msg").textContent="File này không phải bản sao lưu của app. Bố mẹ chọn lại file .json đã tải về nhé."; }
  };
  let target=S.curUnit;
  $("cw-target").value=target;
  const listOf=()=>{ if(target==="custom") return S.custom; const u=UNITS.find(x=>x.id===target); return S.unitWords[target]||unitDefault(u); };
  const editable=()=>{ if(target==="custom") return S.custom; const u=UNITS.find(x=>x.id===target); return S.unitWords[target]||(S.unitWords[target]=unitDefault(u)); };
  const renderList=()=>{
    const L=listOf();
    $("cw-reset").hidden=target==="custom"||!S.unitWords[target];
    $("cw-list").innerHTML=L.length?L.map((c,k)=>`<div class="cw"><input class="emo" id="cw-pic-${k}" value="${esc(c.pic||"")}" aria-label="Hình cho ${esc(c.en)}" maxlength="16"><div class="t"><b>${esc(c.en)}</b><span>${esc(c.vi||"")}</span></div><button class="del" data-k="${k}" aria-label="Xoá ${esc(c.en)}">✕</button></div>`).join(""):`<p class="hint">Chưa có từ nào.</p>`;
    $("cw-list").querySelectorAll(".emo").forEach((inp,k)=>inp.onchange=()=>{ editable()[k].pic=inp.value.trim(); buildWords(); save(); renderList(); });
    $("cw-list").querySelectorAll(".del").forEach(b=>b.onclick=()=>{ editable().splice(+b.dataset.k,1); buildWords(); save(); renderList(); });
  };
  $("cw-add").onclick=()=>{
    const lines=$("cw-bulk").value.split(/\n/).map(s=>s.trim()).filter(Boolean);
    let added=0;
    lines.forEach(line=>{
      const m=line.split(/\s*(?:\t|–|—|=|:|\s-\s|-(?=\s*[^\x00-\x7F]))\s*/);
      const en=(m[0]||"").toLowerCase().replace(/[^a-z' -]/g,"").trim(); const vi=m.slice(1).join(" ").trim();
      if(!en) return;
      const L=editable(); const ex=L.find(c=>c.en===en);
      if(ex){ if(vi) ex.vi=vi; return; }
      if(L.length>=80) return;
      L.push({en,vi,pic:guessPic(en),ex:""}); added++;
    });
    buildWords(); save(); renderList();
    $("cw-bulk").value="";
    $("cw-msg").textContent=added?`Đã thêm ${added} từ vào ${target==="custom"?"My words":UNITS.find(x=>x.id===target).en}.`:"Chưa thêm được từ mới. Mỗi dòng ghi: từ tiếng Anh - nghĩa tiếng Việt.";
  };
  $("cw-target").onchange=()=>{ target=$("cw-target").value; $("cw-msg").textContent=""; renderList(); };
  $("cw-reset").onclick=()=>{ delete S.unitWords[target]; buildWords(); save(); renderList(); $("cw-msg").textContent="Đã đưa bài về danh sách gợi ý."; };
  renderList();
}

// ---------- welcome ----------
function welcome(){
  $app.innerHTML=`<div class="top"><div class="hello"><small>Xin chào</small><h1>Bé học tiếng Anh 👋</h1></div></div>
  <div class="panel">
    <label for="kid-name">Bé tên là gì?</label>
    <input type="text" id="kid-name" maxlength="30" placeholder="Ví dụ: Bin" autocomplete="off">
    <p class="hint">Tên chỉ lưu trên máy này, để app chào bé mỗi ngày.</p>
    <div class="row" style="justify-content:flex-start"><button class="btn go" id="kid-ok">Bắt đầu học 🚀</button></div>
  </div>`;
  const go=()=>{ const n=$("kid-name").value.trim(); if(!n) return $("kid-name").focus(); setKid(n); home(); };
  $("kid-ok").onclick=go; $("kid-name").onkeydown=e=>{ if(e.key==="Enter") go(); };
  $("kid-name").focus();
}

loadLocal(); buildWords(); rollDay(); KID ? home() : welcome();
