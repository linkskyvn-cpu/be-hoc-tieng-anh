<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bé học tiếng Anh</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one-column "sticker book" app — a sky goal strip, then big tappable cards; every screen fits a phone first */
:root{
  --bg:#EAF4FB; --paper:#FFFFFF; --ink:#1D2B3A; --muted:#5B6B7C;
  --sky:#2F8FD8; --sky-ink:#FFFFFF; --sun:#FFC83D; --leaf:#2EAD6B; --berry:#E2486B; --grape:#7A5AE0;
  --line:#CFE0EE; --tile:#F4F9FD; --shadow:0 3px 0 #C3D6E6;
  --f-display:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1B26; --paper:#182836; --ink:#EAF2F9; --muted:#9FB2C4;
  --sky:#4FA8EC; --sky-ink:#0B1520; --sun:#FFD25E; --leaf:#45C584; --berry:#F06A88; --grape:#9C82F0;
  --line:#2A3F52; --tile:#1F3243; --shadow:0 3px 0 #0A131B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1B26; --paper:#182836; --ink:#EAF2F9; --muted:#9FB2C4;
  --sky:#4FA8EC; --sky-ink:#0B1520; --sun:#FFD25E; --leaf:#45C584; --berry:#F06A88; --grape:#9C82F0;
  --line:#2A3F52; --tile:#1F3243; --shadow:0 3px 0 #0A131B; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
input[type=text],input[type=password]{font:inherit;color:var(--ink);background:var(--tile);border:2px solid var(--line);border-radius:14px;padding:10px 12px;width:100%}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;padding-inline:16px;padding-block:0 32px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:16px}
.hello{min-width:0}
.hello small{display:block;color:var(--muted);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.hello h1{font-size:30px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}

.goal{background:var(--sky);color:var(--sky-ink);border-radius:22px;padding:16px 18px;display:grid;gap:10px}
.goal-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.goal h2{font-size:22px}
.bar{height:14px;border-radius:999px;background:color-mix(in srgb,var(--sky-ink) 25%,transparent);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:inherit;transition:width .4s}
.goal .btn{justify-self:start}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:19px;padding:10px 20px;border-radius:16px;background:var(--sun);color:#3A2A00;box-shadow:0 3px 0 #C9951A;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:var(--shadow);border:2px solid var(--line)}
.btn.go{background:var(--leaf);color:#fff;box-shadow:0 3px 0 #1D7A49}
.btn[disabled]{opacity:.45;pointer-events:none}

.section-title{font-size:21px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.section-title span{font-family:var(--f-body);font-size:14px;color:var(--muted);font-weight:700}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.topics.wide{grid-template-columns:repeat(2,minmax(0,1fr))}
.topic{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:14px;text-align:left;display:grid;gap:4px;align-content:start;box-shadow:var(--shadow);transition:transform .08s}
.topic:active{transform:translateY(2px)}
.topic .pic{font-size:38px;line-height:1}
.topic b{font-family:var(--f-display);font-size:19px}
.topic small{color:var(--muted);font-weight:700}
.topic.phonics{border-color:color-mix(in srgb,var(--grape) 45%,var(--line))}
.topic.phonics .pic{font-family:var(--f-display);font-weight:800;color:var(--grape)}
.topic.mine{border-style:dashed}
.topic{position:relative}
.topic.current{border-color:var(--sun);box-shadow:0 3px 0 #C9951A}
.now{position:absolute;top:10px;right:10px;background:var(--sun);color:#3A2A00;font-weight:800;font-size:12px;border-radius:999px;padding:2px 8px}
.topics.units{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:520px){.topics.units{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bubble{border-radius:18px;padding:8px 16px;font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.2;max-width:100%;overflow-wrap:anywhere}
.bubble.q{background:var(--tile);color:var(--muted);font-size:22px}
.bubble.a{background:color-mix(in srgb,var(--sky) 14%,var(--paper));color:var(--ink)}
.sline{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:flex-end;min-height:52px}
.wslot{min-width:64px;height:46px;border-bottom:4px solid var(--line);font-family:var(--f-display);font-size:26px;font-weight:800;display:flex;align-items:flex-end;justify-content:center;padding-inline:4px}
.wslot.fill{border-color:var(--sky)}
.punct{font-family:var(--f-display);font-size:28px;font-weight:800}
.tile.wtile{width:auto;min-width:64px;padding-inline:14px;font-size:24px}
.sel{font:inherit;color:var(--ink);background:var(--tile);border:2px solid var(--line);border-radius:14px;padding:10px 12px;width:100%}
.mini{height:8px;border-radius:999px;background:var(--tile);overflow:hidden;margin-top:4px}
.mini i{display:block;height:100%;background:var(--leaf)}
.badge-done{color:var(--leaf)!important}

.badges{display:flex;flex-wrap:wrap;gap:8px}
.medal{display:flex;align-items:center;gap:6px;background:var(--paper);border:2px dashed var(--line);border-radius:14px;padding:6px 10px;font-weight:700;font-size:15px;color:var(--muted)}
.medal.on{border-style:solid;border-color:var(--sun);color:var(--ink)}
.parent-link{justify-self:center;align-self:center}

.bar-head{display:flex;align-items:center;gap:10px;padding-top:16px}
.bar-head h2{font-size:22px;min-width:0}
.bar-head .count{margin-left:auto;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.back{width:44px;height:44px;border-radius:14px;background:var(--paper);border:2px solid var(--line);font-size:22px;flex:none}
.progress{flex:1;min-width:60px;height:12px;border-radius:999px;background:var(--paper);border:2px solid var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--leaf);transition:width .3s}

.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mode{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:16px;text-align:left;box-shadow:var(--shadow);display:grid;gap:4px;align-content:start}
.mode .pic{font-size:34px}
.wide-mode{border-color:color-mix(in srgb,var(--grape) 45%,var(--line))}
.az{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;width:100%}
.azc{display:grid;justify-items:center;gap:0;background:var(--tile);border:3px solid var(--line);border-radius:16px;padding:6px 4px 8px;transition:transform .15s,border-color .15s}
.azc b{font-family:var(--f-display);font-size:32px;line-height:1.05;color:var(--grape)}
.azc b i{font-style:normal;font-size:.75em;color:var(--sky);margin-left:2px}
.azc span{font-size:26px;line-height:1.2}
.azc small{font-weight:800;font-size:12px;color:var(--muted)}
.azc.on{border-color:var(--berry);transform:scale(1.08);background:color-mix(in srgb,var(--sun) 25%,var(--tile))}
.mode b{font-family:var(--f-display);font-size:20px}
.mode small{color:var(--muted);font-weight:700;font-size:14px}

.stage{background:var(--paper);border:2px solid var(--line);border-radius:26px;padding:22px 18px;display:grid;gap:16px;justify-items:center;text-align:center;box-shadow:var(--shadow)}
.big-pic{font-size:96px;line-height:1.05;min-height:100px}
.big-pic.num{font-family:var(--f-display);font-weight:800;color:var(--grape)}
.big-pic.txt{font-family:var(--f-display);font-weight:800;font-size:56px;color:var(--grape)}
.letter{font-family:var(--f-display);font-weight:800;font-size:110px;line-height:1;color:var(--grape)}
.letter small{font-size:.55em;color:var(--sky)}
.word{font-family:var(--f-display);font-size:44px;font-weight:800;letter-spacing:.01em;overflow-wrap:anywhere}
.word mark{background:none;color:var(--berry)}
.vi{color:var(--muted);font-weight:800;font-size:19px}
.sentence{background:var(--tile);border-radius:14px;padding:8px 14px;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.say{width:76px;height:76px;border-radius:50%;background:var(--sky);color:var(--sky-ink);font-size:34px;box-shadow:0 4px 0 color-mix(in srgb,var(--sky) 60%,#000)}
.say.small{width:52px;height:52px;font-size:22px}
.prompt{font-family:var(--f-display);font-size:22px;font-weight:700;background:var(--tile);border-radius:18px;padding:6px 16px}

.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%}
.choices.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.choice{background:var(--tile);border:3px solid var(--line);border-radius:20px;padding:12px;font-size:58px;line-height:1.1;min-height:96px;overflow-wrap:anywhere}
.choice.num,.choice.txt{font-family:var(--f-display);font-weight:800;color:var(--grape)}
.choice.txt{font-size:34px}
.choice.right{border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 18%,var(--tile))}
.choice.wrong{border-color:var(--berry);background:color-mix(in srgb,var(--berry) 15%,var(--tile));animation:shake .35s}

.slots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.slot{width:40px;height:52px;border-bottom:4px solid var(--line);font-family:var(--f-display);font-size:34px;font-weight:800;display:flex;align-items:flex-end;justify-content:center}
.slot.fill{border-color:var(--sky)}
.slot.given{border-color:transparent;color:var(--muted)}
.slot.gap{width:14px;border:0}
.tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tile{width:56px;height:60px;border-radius:14px;background:var(--sun);color:#3A2A00;font-family:var(--f-display);font-size:32px;font-weight:800;box-shadow:0 3px 0 #C9951A}
.tile.used{visibility:hidden}

.blend{display:flex;gap:10px;justify-content:center}
.btile{display:grid;justify-items:center;gap:2px;background:var(--tile);border:3px solid var(--line);border-radius:18px;padding:6px 14px 8px;min-width:72px;transition:transform .15s,border-color .15s}
.btile b{font-family:var(--f-display);font-size:56px;line-height:1;color:var(--ink)}
.btile small{font-size:22px}
.btile.on{border-color:var(--berry);transform:translateY(-6px)}
.btile.on b{color:var(--berry)}
.cover{width:120px;height:110px;border-radius:22px;background:var(--tile);border:3px dashed var(--line);font-size:44px;font-family:var(--f-display);font-weight:800;color:var(--muted)}

.feedback{min-height:30px;font-family:var(--f-display);font-size:24px;font-weight:800}
.feedback.ok{color:var(--leaf)}
.feedback.no{color:var(--berry)}
.hint{color:var(--muted);font-size:15px;font-weight:700;max-width:44ch}

.result .big-pic{font-size:80px}
.stars-row{font-size:40px;letter-spacing:4px}
.list{display:grid;gap:6px;width:100%;text-align:left}
.list>div{display:flex;gap:10px;align-items:center;background:var(--tile);border-radius:12px;padding:6px 12px;font-weight:700;min-width:0}
.list>div .r{margin-left:auto;color:var(--muted)}

.panel{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:18px;display:grid;gap:12px}
.panel h3{font-size:20px}
.panel label{font-weight:800}
textarea,.emo{font:inherit;color:var(--ink);background:var(--tile);border:2px solid var(--line);border-radius:14px;padding:10px 12px;width:100%}
textarea{min-height:130px;resize:vertical}
.emo{width:56px;text-align:center;font-size:24px;padding:4px}
.cw{display:flex;gap:10px;align-items:center;background:var(--tile);border-radius:14px;padding:6px 8px}
.cw .t{min-width:0;flex:1}
.cw .t b{display:block;font-family:var(--f-display);font-size:19px;overflow-wrap:anywhere}
.cw .t span{color:var(--muted);font-weight:700}
.del{width:40px;height:40px;border-radius:12px;background:var(--paper);border:2px solid var(--line);font-size:18px;flex:none}
.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--tile);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-weight:700;font-size:13px}

.story-title{color:var(--grape);font-weight:800}
.story-text{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 4px;margin:0;max-width:100%}
.sw{font-family:var(--f-display);font-size:32px;font-weight:700;line-height:1.35;padding:0 6px;border-radius:10px;transition:background .15s}
.sw.on{background:var(--sun);color:#3A2A00}
.dform{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
.dict{font-family:var(--f-display);font-size:34px;font-weight:800;text-align:center;letter-spacing:.08em;width:100%;max-width:300px;color:var(--ink);background:var(--tile);border:3px solid var(--line);border-radius:16px;padding:6px 12px}
.dict.ok{border-color:var(--leaf)}
.dict.bad{border-color:var(--berry)}
.keys-hint{display:none}
@media (hover:hover) and (pointer:fine){.keys-hint{display:block}}
@media (min-width:1000px){
  .wrap{max-width:880px}
  .big-pic{font-size:120px;min-height:126px}
  .choices{grid-template-columns:repeat(4,minmax(0,1fr))}
  .choices.three{grid-template-columns:repeat(3,minmax(0,1fr))}
  .modes{grid-template-columns:repeat(4,minmax(0,1fr))}
  .topics{grid-template-columns:repeat(5,minmax(0,1fr))}
  .topics.wide{grid-template-columns:repeat(2,minmax(0,1fr))}
  .word{font-size:52px}
}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start;padding-top:16px}
.main{display:flex;flex-direction:column;gap:18px;min-width:0}
.main .top{padding-top:0}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:10px}
.nav{display:flex;align-items:center;gap:10px;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
.nav-ic{font-size:28px;line-height:1}
.nav-tx{display:grid;min-width:0}
.nav-tx b{font-family:var(--f-display);font-size:18px}
.nav-tx small{color:var(--muted);font-weight:700;font-size:13px}
.nav.on{background:var(--sky);border-color:var(--sky);color:var(--sky-ink)}
.nav.on small{color:inherit;opacity:.85}
.nav-parent{margin-top:12px;box-shadow:none;border-style:dashed}
.phase-head{display:grid;gap:4px}
.phase-head h2{font-size:24px}
.phase-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:6px}
.ptab{border-radius:13px;padding:10px 8px;font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--muted)}
.ptab.on{background:var(--sky);color:var(--sky-ink)}
.wrap.is-home{max-width:1120px}
.only-narrow{display:none}
@media (max-width:760px){.only-narrow{display:inline-flex}}
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr);gap:14px}
  .side{position:static;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .nav{padding:10px;gap:8px;box-shadow:none}
  .nav-ic{font-size:22px}
  .nav-tx b{font-size:16px}
  .nav-parent{display:none}
}
.sight-word{font-size:76px;color:var(--grape)}
.small-pic{font-size:64px;min-height:70px}
mark{background:color-mix(in srgb,var(--sun) 55%,transparent);color:inherit;border-radius:6px;padding:0 3px}
.blank{display:inline-block;min-width:70px;border-bottom:4px solid var(--sky);color:var(--sky);text-align:center;padding:0 6px}
.blank.filled{color:var(--leaf);border-color:var(--leaf)}
.fill-line{font-size:30px}
.big-q{font-size:26px;color:var(--ink)}
.choices.one{grid-template-columns:minmax(0,1fr)!important;max-width:520px}
.choice.txt.long{font-family:var(--f-body);font-size:22px;font-weight:800;min-height:64px;padding:10px 16px}
.qa-list{display:grid;gap:10px;width:100%;max-width:560px}
.qa-item{display:flex;gap:12px;align-items:center;text-align:left;background:var(--tile);border:2px solid var(--line);border-radius:18px;padding:10px 12px}
.qa-pic{font-size:40px;flex:none}
.qa-tx{display:grid;gap:4px;min-width:0}
.qa-tx .bubble{font-size:20px;padding:4px 10px}
.qa-tx small{color:var(--muted);font-weight:700}
.topic.sight .pic,.topic.qword .pic{font-size:34px}
.nav-tx small{overflow-wrap:anywhere}
@media (max-width:760px){.nav{flex-direction:column;align-items:flex-start;padding:8px}.nav-tx b{font-size:15px}.nav-tx small{font-size:11px}}
.rule{background:color-mix(in srgb,var(--sun) 22%,var(--paper));border-radius:16px;padding:12px 16px;font-weight:700;max-width:560px;text-align:left}
.topic.pattern .pic{font-size:30px}
.book-sub{font-weight:800;color:var(--muted);margin:2px 0 -6px}
.topic.sents-card{border-color:color-mix(in srgb,var(--sky) 40%,var(--line))}
.topic.sents-card small:first-of-type{font-style:italic}
.scene{position:relative;width:240px;height:170px;max-width:100%;flex:none}
.scene .ground{position:absolute;left:10px;right:10px;top:146px;height:4px;border-radius:2px;background:var(--line)}
.scene .box-back{position:absolute;left:75px;top:76px;width:90px;height:70px;border-radius:6px 6px 4px 4px;background:#A86F3D;z-index:1}
.scene .box-front{position:absolute;left:71px;top:104px;width:98px;height:42px;border-radius:4px 4px 8px 8px;background:#C98B4E;z-index:3}
.scene .critter{position:absolute;font-size:50px;line-height:1;z-index:2;left:95px;top:64px}
.scene.pos-on .critter{top:28px;z-index:4}
.scene.pos-under .box-back{top:16px;height:60px}
.scene.pos-under .box-front{top:40px;height:36px}
.scene.pos-under .critter{top:92px;z-index:4}
.scene.pos-next-to .critter{left:176px;top:96px;z-index:4}
.scene.pos-behind .critter{top:44px;font-size:42px;left:99px;z-index:0;filter:saturate(.8)}
.scene.pos-in-front-of .critter{top:100px;font-size:58px;left:92px;z-index:5}
.mini-scene{transform:scale(.42);transform-origin:top left;width:240px;height:170px;margin:0 -139px -99px 0}
.vd-in{font:inherit;color:var(--ink);background:var(--tile);border:2px solid var(--line);border-radius:14px;padding:10px 12px;width:100%}
a.btn{text-decoration:none}
.video-box{position:relative;width:100%;max-width:760px;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000}
.video-box iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.movie{position:relative;overflow:hidden;border-radius:26px;min-height:360px;display:grid;justify-items:center;align-content:center;gap:14px;padding:28px 16px 40px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--sky) 30%,var(--paper)) 0%,var(--paper) 70%);border:2px solid var(--line);box-shadow:var(--shadow);text-align:center}
.movie-sky{position:absolute;inset:0;pointer-events:none}
.cloud{position:absolute;font-size:44px;opacity:.7;animation:drift 18s linear infinite}
.cloud.c1{top:14px;left:-60px}.cloud.c2{top:60px;left:-60px;animation-delay:-9s;font-size:32px}
.sun-deco{position:absolute;top:12px;right:18px;font-size:40px;animation:spin 20s linear infinite}
.movie-pic{position:relative;font-size:110px;line-height:1.1;min-height:122px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.movie-pic span{display:inline-block}
.movie-text{position:relative;font-family:var(--f-display);font-size:32px;font-weight:700;margin:0;max-width:640px}
.mw{border-radius:10px;padding:0 4px;transition:background .15s}
.mw.on{background:var(--sun);color:#3A2A00}
.movie-vi{position:relative;color:var(--muted);font-weight:800;margin:0}
.movie-dots{position:absolute;bottom:14px;left:0;right:0;display:flex;gap:6px;justify-content:center}
.movie-dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.movie-dots i.on{background:var(--sky)}
.movie-end{position:relative;display:grid;gap:12px;justify-items:center}
.anim-pop{animation:pop .6s both}
.anim-slide{animation:slidein .7s both}
.anim-bounce{animation:bouncein .8s both}
.anim-spin{animation:spinin .8s both}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(120vw)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slidein{from{transform:translateX(-120px);opacity:0}to{transform:none;opacity:1}}
@keyframes bouncein{0%{transform:translateY(-140px);opacity:0}60%{transform:translateY(12px);opacity:1}80%{transform:translateY(-6px)}100%{transform:none}}
@keyframes spinin{from{transform:rotate(-200deg) scale(.3);opacity:0}to{transform:none;opacity:1}}
@media (max-width:520px){.movie-pic{font-size:80px;min-height:90px}.movie-text{font-size:26px}}
.pop{animation:pop .4s}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.foot{color:var(--muted);font-size:13px;text-align:center}
@media (max-width:380px){.word{font-size:36px}.big-pic{font-size:80px}.slot{width:32px}.tile{width:48px}.btile{min-width:60px;padding-inline:8px}.btile b{font-size:46px}.letter{font-size:90px}}
</style>

// ---------- state ----------
const today = () => new Date().toLocaleDateString("en-CA");
const addDays = (d,n) => { const x=new Date(d+"T00:00:00"); x.setDate(x.getDate()+n); return x.toLocaleDateString("en-CA"); };
let S = {stars:0, words:{}, day:"", doneToday:0, streak:0, lastDay:"", updated:0, custom:[], unitWords:{}, curUnit:"u1"};
function fixState(){ if(!Array.isArray(S.custom)) S.custom=[]; if(!S.unitWords||typeof S.unitWords!=="object") S.unitWords={}; if(!UNITS.some(u=>u.id===S.curUnit)) S.curUnit="u1"; if(!S.storyBest||typeof S.storyBest!=="object") S.storyBest={}; if(!S.videos||typeof S.videos!=="object") S.videos={}; }
let LS_KEY="kien-english";
const blankState=()=>({stars:0,words:{},day:"",doneToday:0,streak:0,lastDay:"",updated:0,custom:[],unitWords:{},curUnit:"u1"});
function loadLocal(){ try{ const s=JSON.parse(localStorage.getItem(LS_KEY)||"null"); if(s) S=Object.assign(S,s);}catch(e){} fixState(); }
function save(){
  S.updated=Date.now();
  try{ localStorage.setItem(LS_KEY,JSON.stringify(S)); }catch(e){}
  cloudSave();
}

let WORDS={}, ABC=null, BLEND=null, MINE=null, QW=null;
function buildWords(){
  WORDS={};
  const mk=(t,arr)=>{ t.list=arr.map(a=>{ const w={key:t.id+":"+a.en, topic:t, ...a}; WORDS[w.key]=w; return w; }); return t; };
  ABC=mk({id:"abc",name:"Chữ cái",en:"ABC",pic:"Aa",kind:"abc"}, LETTERS.map(([l,kw,p])=>({en:l,vi:"",pic:p,kw,ex:""})));
  BLEND=mk({id:"cvc",name:"Ghép âm",en:"c‑a‑t",pic:"cat",kind:"cvc"}, CVC.map(([en,vi,p])=>({en,vi,pic:p,ex:""})));
  TOPICS.forEach(t=>mk(t, t.words.map(([en,vi,pic,ex])=>({en,vi,pic,ex}))));
  UNITS.forEach(u=>{ u.kind="unit"; u.en="Unit "+u.n; mk(u, (S.unitWords[u.id]||unitDefault(u)).map(x=>({en:x.en,vi:x.vi||"",pic:x.pic||"",ex:x.ex||""})));
    u.sents=u.sentences.map((x,k)=>{ const w={key:u.id+":s"+k, topic:u, isSent:true, en:x.a, q:x.q||"", pic:x.pic, vi:x.vi||""}; WORDS[w.key]=w; return w; }); });
  SIGHT_SETS.forEach(t=>{ t.kind="sight"; t.name=t.words.slice(0,4).map(w=>w[0]).join(" · ")+" …"; mk(t, t.words.map(([en,vi,ex,expic])=>({en,vi,pic:"",ex,expic}))); });
  STARTER_TOPICS.forEach(t=>mk(t, t.words.map(([en,vi,pic,ex])=>({en,vi,pic,ex}))));
  PATTERNS.forEach(pt=>{ pt.kind="pattern"; pt.list=[];
    pt.sents=pt.pairs.map((x,k)=>{ const w={key:pt.id+":p"+k, topic:pt, isQA:true, en:x.a, q:x.q||"", pic:x.pic||"", vi:x.vi||"", opts:x.opts||null, pos:x.pos||null}; WORDS[w.key]=w; return w; }); });
  QW={id:"qw",name:"What · Who · Where · How…",en:"Question words",pic:"❓",kind:"qword",list:[]};
  QW.sents=QA_PAIRS.map((x,k)=>{ const w={key:"qw:p"+k, topic:QW, isQA:true, en:x.a, q:x.q, qword:x.w, pic:x.pic, vi:x.vi}; WORDS[w.key]=w; return w; });
  MINE=mk({id:"custom",name:"Từ bố mẹ thêm",en:"My words",pic:"⭐",kind:"custom"}, S.custom.map(c=>({en:c.en,vi:c.vi||"",pic:c.pic||"",ex:""})));
}
function rollDay(){ const t=today(); if(S.day!==t){ S.day=t; S.doneToday=0; } }
function markActive(){ const t=today(); if(S.lastDay===t) return; S.streak = S.lastDay===addDays(t,-1) ? S.streak+1 : 1; S.lastDay=t; }
function W(key){ return S.words[key] || (S.words[key]={box:0,due:"",seen:false,right:0,wrong:0}); }
function grade(key, ok){
  const w=W(key); w.seen=true; rollDay(); markActive(); S.doneToday++;
  if(ok){ w.right++; w.box=Math.min(w.box+1,5); w.due=addDays(today(),BOX_DAYS[w.box]); S.stars++; }
  else { w.wrong++; w.box=1; w.due=today(); }
  save();
}
const dueKeys = () => Object.keys(S.words).filter(k=>WORDS[k] && S.words[k].seen && S.words[k].due && S.words[k].due<=today() && S.words[k].box<5);

// ---------- sound ----------
let enVoice=null, viVoice=null;
function pickVoices(){ try{ const all=speechSynthesis.getVoices(); const en=all.filter(v=>/^en[-_]/i.test(v.lang));
  enVoice=en.find(v=>/en[-_]US/i.test(v.lang)&&/female|samantha|google/i.test(v.name))||en.find(v=>/en[-_]US/i.test(v.lang))||en[0]||null;
  viVoice=all.find(v=>/^vi/i.test(v.lang))||null; }catch(e){} }
try{ pickVoices(); speechSynthesis.onvoiceschanged=pickVoices; }catch(e){}
// parts: [text, "en"|"vi", slow?]; tiếng Việt chỉ đọc khi máy có giọng Việt
function utter(text,lang,slow){
  if(lang==="vi"&&!viVoice) return null;
  const u=new SpeechSynthesisUtterance(text); u.lang=lang==="vi"?"vi-VN":"en-US"; const v=lang==="vi"?viVoice:enVoice; if(v) u.voice=v;
  u.rate=slow?0.5:(lang==="vi"?1:0.75); if(lang==="en") u.pitch=1.1; return u;
}
let speechToken=0;
function stopSpeech(){ speechToken++; try{ speechSynthesis.cancel(); }catch(e){} }
function say(parts){
  stopSpeech();
  try{ parts.forEach(p=>{ if(!p||!p[0]) return; const u=utter(p[0],p[1],p[2]); if(u) speechSynthesis.speak(u); }); }catch(e){}
}
// Đọc từng phần một, nghỉ `gap` ms giữa các phần cho khỏi dính liền nhau
function sayPaced(parts,{gap=900,onStep,onDone}={}){
  stopSpeech(); const my=speechToken; let k=0;
  const next=()=>{
    if(my!==speechToken) return;
    if(k>=parts.length){ onDone&&onDone(); return; }
    const [text,lang,slow,tag]=parts[k++]; onStep&&onStep(tag);
    let fired=false; const go=()=>{ if(fired||my!==speechToken) return; fired=true; setTimeout(next,gap); };
    try{ const u=utter(text,lang,slow); if(!u) return go(); u.onend=go; u.onerror=go; speechSynthesis.speak(u);
      setTimeout(go,1600+text.length*(slow?320:180)); }catch(e){ go(); }
  };
  next();
}
// Tên chữ cái viết theo cách đọc, để giọng máy không đọc "a" thành "ơ"
const LETTER_NAME={a:"ay",b:"bee",c:"see",d:"dee",e:"ee",f:"eff",g:"gee",h:"aitch",i:"eye",j:"jay",k:"kay",l:"el",m:"em",n:"en",o:"oh",p:"pee",q:"cue",r:"ar",s:"ess",t:"tee",u:"you",v:"vee",w:"double you",x:"ex",y:"why",z:"zee"};
const speak=(t,slow)=>say([[t,"en",slow]]);
let actx=null;
function chime(ok){
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const notes=ok?[660,880,1175]:[300,220];
    notes.forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type="triangle"; o.frequency.value=f; const t=actx.currentTime+i*0.11;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.18,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.22); o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.25); });
  }catch(e){}
}

function sentenceQ(w,i,n,done,exit,intro){
  const punct=(w.en.match(/[.!?]$/)||[""])[0];
  const parts=w.en.replace(/[.!?]$/,"").split(/\s+/);
  let tiles=shuffle(parts.map(c=>({c})));
  if(tiles.length>1 && tiles.map(x=>x.c).join(" ")===parts.join(" ")) tiles.reverse();
  let typed=[];
  const text="Nghe rồi xếp từ thành câu";
  $app.innerHTML=`${head("",i,n)}
  <div class="stage">${promptHtml(text)}
    ${w.pos?sceneHtml(w.pos):`<div class="big-pic">${esc(w.pic)}</div>`}
    ${w.q?`<div class="bubble q">🙋 ${esc(w.q)}</div>`:""}
    <div class="row"><button class="say small" id="say" aria-label="Nghe">🔊</button><button class="btn ghost" id="undo">⌫ Xoá</button></div>
    <div class="sline" id="sline"></div><div class="tiles" id="tiles"></div>
    <div class="feedback" id="fb" aria-live="polite"></div></div>`;
  bindBack(exit);
  const play=()=>sayPaced([w.q?[w.q,"en"]:null,[w.en,"en"]].filter(Boolean),{gap:800});
  const pr=$("pr");
  pr.onclick=()=>sayPaced([[text,"vi"],w.q?[w.q,"en"]:null,[w.en,"en"]].filter(Boolean),{gap:700});
  setTimeout(()=>{ if(!pr.isConnected) return; intro ? pr.onclick() : play(); }, 250);
  $("say").onclick=play;
  const sl=$("sline"), tl=$("tiles"), fb=$("fb");
  let finished=false, tries=0;
  const draw=()=>{
    sl.innerHTML=parts.map((_,k)=>typed[k]?`<span class="wslot fill">${esc(typed[k].c)}</span>`:`<span class="wslot"></span>`).join("")+(punct?`<span class="punct">${punct}</span>`:"");
    tl.innerHTML=tiles.map((x,k)=>`<button class="tile wtile ${typed.includes(x)?"used":""}" data-k="${k}">${esc(x.c)}</button>`).join("");
    tl.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{ if(finished) return; const x=tiles[+b.dataset.k]; if(typed.includes(x)) return; typed.push(x); speak(x.c); draw(); if(typed.length===parts.length) check(); });
  };
  const check=()=>{
    if(typed.map(x=>x.c).join(" ")===parts.join(" ")){ finished=true; fb.className="feedback ok"; fb.textContent=`⭐ ${pick(praiseVi)}`; sl.classList.add("pop"); chime(true); setTimeout(()=>speak(w.en),300); done(tries===0); }
    else { tries++; chime(false);
      if(tries>=2){ finished=true; fb.className="feedback no"; fb.textContent="Câu đúng là:"; typed=parts.map(c=>({c})); draw(); setTimeout(()=>speak(w.en),300); done(false); }
      else { fb.className="feedback no"; fb.textContent="Gần đúng rồi, thử lại nhé!"; setTimeout(()=>{ if(finished) return; typed=[]; draw(); fb.textContent=""; },1000); }
    }
  };
  $("undo").onclick=()=>{ if(!finished){ typed.pop(); draw(); } };
  draw();
}
function pickFor(m,list){
  if(m!=="dictate") return pickSession(list,8);
  const easy=list.filter(w=>/^[a-z]{2,7}$/.test(w.en));

}

function storyRead(u,i){
  const st=STORIES[u.id], pg=st.pages[i], last=i===st.pages.length-1;
  const words=pg[1].split(" ");
  $app.innerHTML=`${head("",i+1,st.pages.length)}

    <div class="row"><button class="btn ghost" id="prev" ${i?"":"disabled"}>← Trước</button><button class="btn go" id="next">${last?"Trả lời câu hỏi ❓":"Trang sau →"}</button></div>
  </div>`;
  bindBack(()=>unitMenu(u));
  const spans=[...$app.querySelectorAll(".sw")];
  const starts=[]; let pos=0; words.forEach(w=>{ starts.push(pos); pos+=w.length+1; });
  const mark=k=>spans.forEach((sp,j)=>sp.classList.toggle("on",j===k));
  const read=slow=>{
    stopSpeech(); const my=speechToken; const ut=utter(pg[1],"en",slow); if(!ut) return;
    let boundary=false;
    ut.onboundary=e=>{ if(my!==speechToken||(e.name&&e.name!=="word")) return; boundary=true; let k=0; for(let j=0;j<starts.length;j++) if(starts[j]<=e.charIndex) k=j; mark(k); };
    ut.onend=()=>{ if(my===speechToken) mark(-1); };
    try{ speechSynthesis.speak(ut); }catch(e){}
    // Máy nào không báo vị trí từ thì tô sáng theo nhịp ước lượng
    let k=0; const per=slow?620:400;
    const tick=()=>{ if(my!==speechToken||boundary) return; if(k<spans.length){ mark(k); setTimeout(tick,per+spans[k++].textContent.length*35); } else mark(-1); };
    setTimeout(()=>{ if(!boundary) tick(); },300);
  };
  spans.forEach(sp=>sp.onclick=()=>{ stopSpeech(); mark(+sp.dataset.k); speak(sp.textContent.replace(/[^A-Za-z'-]/g,"")); });
  $("s1").onclick=()=>read(false); $("s2").onclick=()=>read(true);
  $("tvi").onclick=()=>{ const v=$("stvi"); v.hidden=!v.hidden; $("tvi").textContent=v.hidden?"Nghĩa tiếng Việt":"Ẩn nghĩa"; };
  $("prev").onclick=()=>storyRead(u,i-1);
  $("next").onclick=()=> last ? runQuiz(st.qs.map((q,k)=>({w:{key:u.id+":story:"+k, topic:u, en:q.q, q:q.q, vi:q.vi, opts:q.opts, a:q.a, txt:!!q.txt, pic:q.opts[q.a]}, mode:"storyq"})), ()=>unitMenu(u), u) : storyRead(u,i+1);
  setTimeout(()=>{ if(spans[0]&&spans[0].isConnected) read(false); },250);
}

  const inp=$("dict-input"), fb=$("fb"); let tries=0, finished=false;

    tries++; chime(false);

    fb.className="feedback no"; fb.textContent="Gần đúng rồi, thử lại nhé!";

  };
}

const graphemes=t=>{ try{ return [...new Intl.Segmenter(undefined,{granularity:"grapheme"}).segment(t)].map(x=>x.segment); }catch(e){ return Array.from(t); } };
function storyMovie(u){
  const st=STORIES[u.id]; const sid=++quizSeq; let i=0, paused=false, timer=null;
  $app.innerHTML=`${head(st.title)}
  <div class="movie" id="movie">
    <div class="movie-sky"><span class="cloud c1">☁️</span><span class="cloud c2">☁️</span><span class="sun-deco">${i%2?"🌤️":"☀️"}</span></div>

  </div>
  <div class="row"><button class="say small" id="mv-prev" aria-label="Trang trước">⏮</button><button class="say" id="mv-play" aria-label="Tạm dừng">⏸</button><button class="say small" id="mv-next" aria-label="Trang sau">⏭</button><button class="btn ghost" id="mv-vi-t">Nghĩa tiếng Việt</button></div>`;
  bindBack(()=>{ clearTimeout(timer); unitMenu(u,2); });
  const alive=()=>sid===quizSeq;
  const show=k=>{
    clearTimeout(timer); stopSpeech(); if(!alive()) return;
    i=Math.max(0,Math.min(k,st.pages.length-1));
    const [pic,en,vi]=st.pages[i], anims=["anim-pop","anim-slide","anim-bounce","anim-spin"];
    const a=anims[i%anims.length];
    $("mv-pics").innerHTML=graphemes(pic).filter(g=>g.trim()).map((g,j)=>`<span class="${a}" style="animation-delay:${j*0.18}s">${esc(g)}</span>`).join("");
    const words=en.split(" ");
    $("mv-text").innerHTML=words.map((w,j)=>`<span class="mw" data-k="${j}">${esc(w)}</span>`).join(" ");
    $("mv-vi").textContent=vi;
    $app.querySelectorAll("#mv-dots i").forEach((d,j)=>d.classList.toggle("on",j<=i));
    if(!paused) narrate();
  };
  const narrate=()=>{
    const [,en]=st.pages[i], spans=[...$app.querySelectorAll(".mw")];
    const starts=[]; let pos=0; en.split(" ").forEach(w=>{ starts.push(pos); pos+=w.length+1; });
    const mark=k=>spans.forEach((sp,j)=>sp.classList.toggle("on",j===k));
    stopSpeech(); const my=speechToken; let boundary=false, ended=false;
    const t0=Date.now(), minMs=3000+en.length*70; // mỗi trang hiện ít nhất chừng này, kể cả khi máy không đọc được
    const after=()=>{ if(ended||!alive()||paused||my!==speechToken) return; ended=true; mark(-1);
      timer=setTimeout(()=>{ if(!alive()||paused) return; if(i<st.pages.length-1){ chime(true); show(i+1); } else theEnd(); },Math.max(1300,minMs-(Date.now()-t0))); };
    const ut=utter(en,"en",false);
    if(ut){ ut.onboundary=e=>{ if(my!==speechToken||(e.name&&e.name!=="word")) return; boundary=true; let k=0; for(let j=0;j<starts.length;j++) if(starts[j]<=e.charIndex) k=j; mark(k); };
      ut.onend=after; ut.onerror=after; try{ speechSynthesis.speak(ut); }catch(e){} }
    let k=0; const tick=()=>{ if(my!==speechToken||boundary||!alive()) return; if(k<spans.length){ mark(k); setTimeout(tick,420+spans[k++].textContent.length*35); } };
    setTimeout(()=>{ if(!boundary) tick(); },300);
    timer=setTimeout(after,2200+en.length*110); // dự phòng khi máy không báo đọc xong
  };
  const theEnd=()=>{ if(!alive()) return;
    $("movie").innerHTML=`<div class="movie-end"><div class="big-pic anim-pop">🌟</div><h2>The End!</h2><p class="hint">Hết truyện "${esc(st.title)}" rồi. Mình trả lời câu hỏi nhé!</p>
      <div class="row"><button class="btn ghost" id="mv-again">🔁 Xem lại</button><button class="btn go" id="mv-quiz">Trả lời câu hỏi ❓</button></div></div>`;
    speak("The end!");

// ---------- quiz engine ----------
function runQuiz(items, onExit, t){
  if(!items.length) return onExit();
  const results=[]; let i=0, lastMode=""; const sid=++quizSeq;
  const modes={listen:listenQ,spell:spellQ,speak:speakQ,first:firstQ,read:readQ,sentence:sentenceQ,dictate:dictQ,storyq:storyQ,find:findQ,fill:fillQ,qa:qaQ,qwblank:qwBlankQ};
  const next=()=>{ if(i>=items.length) return result(results,onExit,t,items);
    const it=items[i]; const intro=it.mode!==lastMode; lastMode=it.mode;
    const done=ok=>{ grade(it.w.key,ok); results.push({w:it.w,ok}); i++; setTimeout(()=>{ if(sid===quizSeq) next(); }, ok?1000:1800); };
    modes[it.mode](it.w,i,items.length,done,onExit,intro); };
  next();
}

function answerChoices(w, done, wrongMsg, after){

function listenQ(w,i,n,done,exit,intro){
  let pool=w.topic.list.filter(x=>x.key!==w.key);
  if(pool.length<3) pool=pool.concat(shuffle(TOPICS.flatMap(t=>t.list)).filter(x=>x.en!==w.en).slice(0,3-pool.length));
  const opts=shuffle([w,...shuffle(pool).slice(0,3)]);
  const text="Nghe và chọn hình đúng";
  $app.innerHTML=`${head("",i,n)}
  <div class="stage">${promptHtml(text)}
    <button class="say" id="say" aria-label="Nghe lại">🔊</button>
    <div class="choices">${opts.map(o=>`<button class="choice${!o.pic?" txt":isNumPic(o.pic)?" num":""}" data-k="${o.key}" aria-label="${esc(o.vi||o.en)}">${esc(o.pic||o.en)}</button>`).join("")}</div>
    <div class="feedback" id="fb" aria-live="polite"></div></div>`;
  bindBack(exit); bindPrompt(text,w.en,intro);
  $("say").onclick=()=>speak(w.en);
  answerChoices(w, done, ()=>`Chưa đúng. Đây mới là "${w.en}"`, ()=>say([[w.en,"en"]]));
}
function spellQ(w,i,n,done,exit,intro){
  const letters=w.en.split("");
  const idxs=letters.map((c,k)=>/[a-z]/i.test(c)?k:-1).filter(k=>k>=0);
  // Bé lớp 1: từ dài hơn 4 chữ thì hiện sẵn chữ đầu và vài chữ, chỉ để trống 4 ô
  let hide=idxs;
  if(idxs.length>4) hide=shuffle(idxs.slice(1)).slice(0,4).sort((a,b)=>a-b);
  const hidden=new Set(hide);
  let tiles=shuffle(hide.map(k=>({c:letters[k]})));
  if(tiles.length>2 && tiles.map(x=>x.c).join("")===hide.map(k=>letters[k]).join("")) tiles.reverse();
  let typed=[];
  const text="Xếp chữ cái thành từ";
  $app.innerHTML=`${head("",i,n)}
  <div class="stage">${promptHtml(text)}
    ${w.pic?picHtml(w):`<div class="big-pic">🔊</div>`}${w.vi?`<div class="vi">${esc(w.vi)}</div>`:""}
    <div class="row"><button class="say small" id="say" aria-label="Nghe">🔊</button><button class="btn ghost" id="undo">⌫ Xoá</button></div>
    <div class="slots" id="slots"></div><div class="tiles" id="tiles"></div>
    <div class="feedback" id="fb" aria-live="polite"></div></div>`;
  bindBack(exit); bindPrompt(text,w.en,intro);
  const slots=$("slots"), tl=$("tiles"), fb=$("fb");
  let finished=false, tries=0;
  const draw=()=>{
    let t=0;
    slots.innerHTML=letters.map((c,k)=>{ if(c===" ") return `<span class="slot gap"></span>`; if(!hidden.has(k)) return `<span class="slot given">${esc(c)}</span>`; const v=typed[t++]; return `<span class="slot ${v?"fill":""}">${v?esc(v.c):""}</span>`; }).join("");
    tl.innerHTML=tiles.map((x,k)=>`<button class="tile ${typed.includes(x)?"used":""}" data-k="${k}">${esc(x.c)}</button>`).join("");
    tl.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{ if(finished) return; const x=tiles[+b.dataset.k]; if(typed.includes(x)) return; typed.push(x); draw(); if(typed.length===hide.length) check(); });
  };
  const check=()=>{
    const ok=typed.every((x,k)=>x.c===letters[hide[k]]);
    if(ok){ finished=true; fb.className="feedback ok"; fb.textContent=`⭐ ${pick(praiseVi)}`; slots.classList.add("pop"); chime(true); speak(w.en); done(tries===0); }
    else { tries++; chime(false);
      if(tries>=2){ finished=true; fb.className="feedback no"; fb.textContent=`Đáp án: ${w.en}`; typed=hide.map(k=>({c:letters[k]})); draw(); speak(w.en); done(false); }
      else { fb.className="feedback no"; fb.textContent="Gần đúng rồi, thử lại nhé!"; setTimeout(()=>{ if(finished) return; typed=[]; draw(); fb.textContent=""; },900); }
    }
  };
  $("say").onclick=()=>speak(w.en,true);
  $("undo").onclick=()=>{ if(!finished){ typed.pop(); draw(); } };
  draw();
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let micBlocked=!SR;
function speakQ(w,i,n,done,exit,intro){
  const text="Nghe rồi đọc to theo nhé";
  $app.innerHTML=`${head("",i,n)}
  <div class="stage">${promptHtml(text)}
    ${w.pic?picHtml(w):""}<div class="word">${esc(w.en)}</div>${w.vi?`<div class="vi">${esc(w.vi)}</div>`:""}
    <div class="row"><button class="say small" id="say" aria-label="Nghe">🔊</button><button class="say small" id="slow" aria-label="Đọc chậm">🐢</button></div>
    <div class="row" id="act"></div>
    <div class="feedback" id="fb" aria-live="polite"></div>
    <p class="hint" id="hint"></p></div>`;
  bindBack(exit); bindPrompt(text,w.en,intro);
  const fb=$("fb"), act=$("act"), hint=$("hint");
  $("say").onclick=()=>speak(w.en);
  $("slow").onclick=()=>speak(w.en,true);
  let finished=false;
  const finish=(ok,msg)=>{ if(finished) return; finished=true; act.innerHTML=""; fb.className="feedback "+(ok?"ok":"no"); fb.textContent=msg; chime(ok); done(ok); };
  const selfCheck=()=>{
    hint.textContent="Con đọc to từ trên 2–3 lần, rồi bấm nút bên dưới. Bố mẹ nghe giúp con nhé!";
    act.innerHTML=`<button class="btn go" id="yes">😀 Con đọc được rồi</button><button class="btn ghost" id="no">🤔 Còn khó</button>`;
    $("yes").onclick=()=>finish(true,`⭐ ${pick(praiseVi)}`);
    $("no").onclick=()=>{ speak(w.en,true); finish(false,"Không sao, mình sẽ ôn lại từ này sau!"); };
  };
  if(micBlocked) return selfCheck();
  act.innerHTML=`<button class="btn go" id="mic">🎤 Bấm rồi nói</button>`;
  hint.textContent="Bấm nút, rồi nói to từ tiếng Anh ở trên.";
  let tries=0;
  $("mic").onclick=()=>{
    let rec; try{ rec=new SR(); }catch(e){ micBlocked=true; return selfCheck(); }
    rec.lang="en-US"; rec.maxAlternatives=5; rec.interimResults=false;
    fb.className="feedback"; fb.textContent="👂 Đang nghe…";
    let heard=false;
    const norm=s=>" "+s.toLowerCase().replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim()+" ";
    rec.onresult=e=>{ heard=true; const alts=[...e.results[0]].map(a=>a.transcript);
      if(alts.some(a=>norm(a).includes(norm(w.en)))) finish(true,`⭐ ${pick(praiseVi)} Con nói rất chuẩn!`);
      else { tries++; if(tries>=3) finish(false,`Máy nghe là "${alts[0]}". Mình ôn lại sau nhé!`); else { fb.className="feedback no"; fb.textContent=`Máy nghe là "${alts[0]}". Thử lại nhé!`; speak(w.en,true); } } };
    rec.onerror=e=>{ if(["not-allowed","service-not-allowed","audio-capture"].includes(e.error)){ micBlocked=true; fb.textContent=""; selfCheck(); hint.textContent="Máy chưa cho dùng micro. Bố mẹ bấm biểu tượng micro trên thanh địa chỉ để cho phép, rồi tải lại trang. Tạm thời con tự chấm nhé!"; } else { fb.className="feedback no"; fb.textContent="Chưa nghe rõ, bấm nói lại nhé!"; } };
    rec.onend=()=>{ if(!heard && !finished && !micBlocked && fb.textContent==="👂 Đang nghe…"){ fb.className="feedback no"; fb.textContent="Chưa nghe rõ, bấm nói lại nhé!"; } };
    try{ rec.start(); }catch(e){ micBlocked=true; selfCheck(); }
  };
}

function result(results,onExit,t,items){
  const right=results.filter(r=>r.ok).length, n=results.length;
  const ratio=n?right/n:0;

  const wrong=results.filter(r=>!r.ok);
  if(t && items[0] && items[0].mode==="storyq"){ S.storyBest[t.id]=Math.max(S.storyBest[t.id]||0,stars); save(); }
  $app.innerHTML=`${head("Kết quả")}
  <div class="stage result">
    <div class="big-pic pop">${stars===3?"🏆":stars===2?"🎉":"💪"}</div>

  </div>`;
  say([[stars===3?"Xuất sắc! Con giỏi lắm!":stars===2?"Giỏi lắm!":"Cố lên nhé!","vi"],[stars===3?"Excellent! You are a star!":"Good job!","en"]]);
  bindBack(onExit);
  $("out").onclick=maybeBreak(onExit);
  $("again").onclick=maybeBreak(()=>runQuiz(shuffle(items),onExit,t));
}

    $("cw-list").querySelectorAll(".del").forEach(b=>b.onclick=()=>{ editable().splice(+b.dataset.k,1); buildWords(); save(); renderList(); });
  };
  $("cw-add").onclick=()=>{
    const lines=$("cw-bulk").value.split(/\n/).map(s=>s.trim()).filter(Boolean);
    let added=0;
    lines.forEach(line=>{
      const m=line.split(/\s*(?:\t|–|—|=|:|\s-\s|-(?=\s*[^\x00-\x7F]))\s*/);
      const en=(m[0]||"").toLowerCase().replace(/[^a-z' -]/g,"").trim(); const vi=m.slice(1).join(" ").trim();
      if(!en) return;
      const L=editable(); const ex=L.find(c=>c.en===en);
      if(ex){ if(vi) ex.vi=vi; return; }
      if(L.length>=80) return;
      L.push({en,vi,pic:guessPic(en),ex:""}); added++;
    });
    buildWords(); save(); renderList();
    $("cw-bulk").value="";
    $("cw-msg").textContent=added?`Đã thêm ${added} từ vào ${target==="custom"?"My words":unitLabel(UNITS.find(x=>x.id===target))}.`:"Chưa thêm được từ mới. Mỗi dòng ghi: từ tiếng Anh - nghĩa tiếng Việt.";
  };
  { let vt=focusUnit||S.curUnit; $("vd-target").value=vt;
    const vu=()=>UNITS.find(x=>x.id===vt);
    const vRender=()=>{ $("vd-search").href=ytSearch(vu()); const L=S.videos[vt]||[];
      $("vd-list").innerHTML=L.length?L.map((v,k)=>`<div class="cw"><span class="emo" style="border:0;background:none">🎬</span><div class="t"><b>${esc(v.title||"Video "+(k+1))}</b><span>youtu.be/${esc(v.id)}</span></div><button class="del vd-del" data-k="${k}" aria-label="Xoá video">✕</button></div>`).join(""):`<p class="hint">Unit này chưa có video.</p>`;
      $("vd-list").querySelectorAll(".vd-del").forEach(b=>b.onclick=()=>{ S.videos[vt].splice(+b.dataset.k,1); save(); vRender(); }); };
    $("vd-target").onchange=()=>{ vt=$("vd-target").value; $("vd-msg").textContent=""; vRender(); };
    $("vd-add").onclick=()=>{ const id=ytId($("vd-url").value);
      if(!id){ $("vd-msg").textContent="Link chưa đúng. Bố mẹ mở video trên YouTube, bấm Chia sẻ → Sao chép đường liên kết, rồi dán vào đây."; return; }
      const L=S.videos[vt]||(S.videos[vt]=[]); if(L.some(v=>v.id===id)){ $("vd-msg").textContent="Video này đã có rồi."; return; }
      if(L.length>=6){ $("vd-msg").textContent="Mỗi Unit tối đa 6 video."; return; }
      L.push({id,title:$("vd-title").value.trim()}); save(); $("vd-url").value=""; $("vd-title").value="";
      $("vd-msg").textContent=`Đã thêm video vào ${unitLabel(vu())}.`; vRender(); };
    vRender(); if(focusUnit) setTimeout(()=>$("vd-panel").scrollIntoView({behavior:"smooth"}),50); }
  $("cw-target").onchange=()=>{ target=$("cw-target").value; $("cw-msg").textContent=""; renderList(); };
  $("cw-reset").onclick=()=>{ delete S.unitWords[target]; buildWords(); save(); renderList(); $("cw-msg").textContent="Đã đưa bài về danh sách gợi ý."; };
  renderList();
}

// ---------- phím tắt bàn phím (máy tính) ----------
document.addEventListener("keydown",e=>{
  const tg=e.target;
  if(tg && /^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName)) return;
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const k=e.key;
  const click=sel=>{ const el=$app.querySelector(sel); if(el && !el.disabled && !el.hidden){ el.click(); return true; } return false; };
  let handled=false;
  if(k==="Escape") handled=click("#back");
  else if(/^[1-9]$/.test(k)){
    const ch=[...$app.querySelectorAll(".choice")], md=[...$app.querySelectorAll(".mode")], el=(ch.length?ch:md)[+k-1];
    if(el){ el.click(); handled=true; }
  }
  else if(k===" ") handled=click("#say")||click("#s1")||click("#mic")||click("#pr");
  else if(k==="Enter") handled=click("#next")||click("#out")||click("#mv-skip");
  else if(k==="ArrowRight") handled=click("#next");
  else if(k==="ArrowLeft") handled=click("#prev");
  else if(k==="Backspace") handled=click("#undo");
  else if(/^[a-zA-Z]$/.test(k)){
    const l=k.toLowerCase();
    const tile=[...$app.querySelectorAll(".tile:not(.used):not(.wtile)")].find(b=>b.textContent===l);
    if(tile){ tile.click(); handled=true; }
    else { const az=[...$app.querySelectorAll(".azc")].find(b=>b.dataset.l===l); if(az){ az.click(); handled=true; } }
  }
  if(handled) e.preventDefault();
});

// ---------- tài khoản (Firebase) ----------
const FIREBASE_CONFIG = {"apiKey": "AIzaSyAAQPZQPMwcMXJcOpGRDzT2r42ecbU1BtE", "authDomain": "be-hoc-tieng-anh.firebaseapp.com", "projectId": "be-hoc-tieng-anh", "storageBucket": "be-hoc-tieng-anh.firebasestorage.app", "messagingSenderId": "634344849683", "appId": "1:634344849683:web:03e265ee67a96f34b39ae6"};
const EMAIL_DOMAIN = "@be-hoc-tieng-anh.app"; // Firebase cần email, nên tên đăng nhập được ghép thành dạng email
let fbAuth=null, fbDb=null, userDoc=null, cloudTimer=null, accountName="", syncState={ok:null,at:0,code:""};
let authAnswered=false, authAbandoned=false;
const IN_APP=/Zalo|FBAN|FBAV|FB_IAB|Instagram|Line\/|Messenger|TikTok/i.test(navigator.userAgent||"");
const inAppTip=()=>IN_APP?`<div class="rule">📱 Anh/chị đang mở app trong Zalo hoặc Facebook. Hãy bấm <b>⋯</b> rồi chọn <b>Mở bằng trình duyệt</b> (Safari hoặc Chrome) để đăng nhập ổn định và dùng được micro.</div>`:"";
// Firebase không trả lời (thường do mở trong Zalo/Facebook hoặc mạng yếu): không để app treo
function stuckScreen(){
  $app.innerHTML=`<div class="top"><div class="hello"><small>Bé học tiếng Anh</small><h1>Chưa kết nối được 😅</h1></div></div>
  <div class="panel">
    ${inAppTip()}
    <p>App chưa kết nối được tới máy chủ đăng nhập. Thường là do đang mở trong Zalo/Facebook, hoặc mạng đang yếu.</p>
    <div class="row" style="justify-content:flex-start"><button class="btn go" id="st-retry">🔄 Thử lại</button><button class="btn ghost" id="st-local">Học tạm, không đăng nhập</button></div>
    <p class="hint">"Học tạm" chỉ lưu tiến độ trên máy này, không đồng bộ lên tài khoản.</p>
  </div>`;
  $("st-retry").onclick=()=>location.reload();
  $("st-local").onclick=()=>{ authAbandoned=true; fbAuth=null; userDoc=null; LS_KEY="kien-english"; S=blankState(); loadLocal(); buildWords(); rollDay(); KID ? home() : welcome(); };
}
const FB_VER="10.12.2", FB_URL=n=>`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-${n}.js`;
const withTimeout=(pr,ms)=>Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej(Object.assign(new Error("timeout"),{code:"timeout"})),ms))]);
// Chỉ dùng đăng nhập bằng mật khẩu nên khởi tạo Auth không kèm trình xử lý popup/redirect (tránh tải iframe gây treo trên Safari iPhone, Zalo)
async function startFirebase(){
  const [A,U,F]=await Promise.all([import(FB_URL("app")),import(FB_URL("auth")),import(FB_URL("firestore"))]);
  const app=A.initializeApp(FIREBASE_CONFIG);
  const auth=U.initializeAuth(app,{persistence:[U.indexedDBLocalPersistence,U.browserLocalPersistence,U.inMemoryPersistence]});
  const db=F.getFirestore(app);
  fbAuth={
    onAuthStateChanged:f=>U.onAuthStateChanged(auth,f),
    createUserWithEmailAndPassword:(e,p)=>U.createUserWithEmailAndPassword(auth,e,p),
    signInWithEmailAndPassword:(e,p)=>U.signInWithEmailAndPassword(auth,e,p),
    signOut:()=>U.signOut(auth)};
  fbDb={ collection:c=>({ doc:id=>{ const r=F.doc(db,c,id); return {
    get:async()=>{ const snap=await withTimeout(F.getDoc(r),10000); return {exists:snap.exists(), data:()=>snap.data()}; },
    set:v=>F.setDoc(r,v) }; } }) };
}
const loadingHtml=t=>`<div class="stage" style="margin-top:48px"><p class="prompt">${esc(t)}</p></div>`;
function syncText(){
  if(syncState.ok===null) return "☁️ Tiến độ đang được lưu theo tài khoản";
  if(syncState.ok) return "☁️ Đã lưu lên mạng lúc "+new Date(syncState.at).toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"});
  return "⚠️ Chưa lưu được lên mạng ("+syncState.code+"). App vẫn lưu trên máy này và sẽ thử lại ở lần lưu sau.";
}
let cloudPending=null;
function cloudSave(){
  if(!userDoc) return;
  clearTimeout(cloudTimer);
  const doc=userDoc, data={name:KID, state:JSON.parse(JSON.stringify(S)), updated:S.updated||Date.now()};
  cloudPending=()=>{ cloudPending=null; return doc.set(data)
      .then(()=>{ syncState={ok:true,at:Date.now(),code:""}; })
      .catch(e=>{ syncState={ok:false,at:Date.now(),code:e.code||"lỗi"}; })
      .finally(()=>{ const el=$("sync-status"); if(el) el.textContent=syncText(); }); };
  cloudTimer=setTimeout(()=>cloudPending&&cloudPending(),800);
}
// Lưu ngay phần còn chờ (trước khi đăng xuất hoặc khi rời trang)
function cloudFlush(){ clearTimeout(cloudTimer); return cloudPending ? cloudPending() : Promise.resolve(); }
document.addEventListener("visibilitychange",()=>{ if(document.hidden) cloudFlush(); });
const readJSON=k=>{ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } };
async function onUser(user){
  clearTimeout(cloudTimer); cloudPending=null;
  if(!user){ userDoc=null; accountName=""; LS_KEY="kien-english"; return loginScreen(); }
  accountName=(user.email||"").replace(EMAIL_DOMAIN,"");
  LS_KEY="kien-english-"+user.uid;
  $app.innerHTML=loadingHtml("Đang tải tiến độ của bé…");
  const doc=fbDb.collection("users").doc(user.uid);
  let local=readJSON(LS_KEY), cloud=null, cloudOk=true;
  try{ const snap=await doc.get(); cloud=snap.exists?snap.data():null; }
  catch(e){ cloudOk=false; syncState={ok:false,at:Date.now(),code:e.code||"lỗi"}; }
  let name=readJSON(LS_KEY+"-name");
  // Tài khoản mới trên máy đã học từ trước: mang tiến độ cũ của máy này lên tài khoản
  // Chỉ chép một lần trên mỗi máy, cho tài khoản đầu tiên đăng nhập ở máy đó
  if(!cloud && !local && cloudOk){
    let migrated=false;
    try{ migrated=!!localStorage.getItem("kien-english-migrated") || Object.keys(localStorage).some(k=>/^kien-english-[A-Za-z0-9]{20,}$/.test(k) && k!==LS_KEY); }catch(e){ migrated=true; }
    if(!migrated){
      local=readJSON("kien-english");
      if(!name){ try{ name=localStorage.getItem("kien-english-name")||""; }catch(e){} }
    }
    try{ localStorage.setItem("kien-english-migrated",user.uid); }catch(e){}
  }
  const useCloud = !!cloud && (!local || (cloud.updated||0) >= (local.updated||0));
  S=Object.assign(blankState(), useCloud ? (cloud.state||{}) : (local||{}));
  KID=(useCloud ? cloud.name : (name || (cloud&&cloud.name))) || "";
  fixState(); buildWords(); rollDay();
  userDoc=doc;
  try{ localStorage.setItem(LS_KEY,JSON.stringify(S)); localStorage.setItem(LS_KEY+"-name",JSON.stringify(KID)); }catch(e){}
  if(!useCloud && (local||KID)) cloudSave();
  KID ? home() : welcome();
}
const BAD_LOGIN="Sai tên đăng nhập hoặc mật khẩu.";
const AUTH_MSG={"auth/invalid-credential":BAD_LOGIN,"auth/invalid-login-credentials":BAD_LOGIN,"auth/wrong-password":BAD_LOGIN,"auth/user-not-found":BAD_LOGIN,
  "auth/email-already-in-use":"Tên đăng nhập này đã có người dùng, bố mẹ chọn tên khác nhé.",
  "auth/weak-password":"Mật khẩu cần ít nhất 6 ký tự.",
  "auth/network-request-failed":"Máy đang không có mạng. Bố mẹ kiểm tra wifi rồi thử lại.",
  "auth/too-many-requests":"Thử sai nhiều lần quá, đợi vài phút rồi thử lại nhé.",
  "auth/operation-not-allowed":"Firebase chưa bật cách đăng nhập Email/Password.",
  "auth/invalid-email":"Tên đăng nhập chỉ dùng chữ không dấu, số, dấu chấm hoặc gạch ngang."};
function loginScreen(mode){
  const signup=mode==="signup";
  $app.innerHTML=`<div class="top"><div class="hello"><small>Bé học tiếng Anh</small><h1>${signup?"Tạo tài khoản 🌟":"Đăng nhập 👋"}</h1></div></div>
  ${inAppTip()}
  <form class="panel" id="login-form" novalidate>
    <label for="login-user">Tên đăng nhập</label>
    <input type="text" id="login-user" maxlength="30" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="ví dụ: trungkien">
    <label for="login-pass">Mật khẩu</label>
    <input type="password" id="login-pass" autocomplete="${signup?"new-password":"current-password"}" placeholder="ít nhất 6 ký tự">
    ${signup?`<label for="login-pass2">Nhập lại mật khẩu</label><input type="password" id="login-pass2" autocomplete="new-password">`:""}
    <p class="feedback no" id="login-msg" aria-live="polite" style="font-size:17px;min-height:0"></p>
    <div class="row" style="justify-content:space-between;align-items:center">
      <button class="btn go" id="login-go" type="submit">${signup?"Tạo tài khoản":"Đăng nhập"}</button>
      <button class="btn ghost" id="login-switch" type="button">${signup?"← Đã có tài khoản":"Tạo tài khoản mới"}</button>
    </div>
    <p class="hint">${signup?"Tên đăng nhập viết liền, không dấu. Bố mẹ ghi lại mật khẩu để đăng nhập trên máy khác.":"Đăng nhập một lần, máy sẽ nhớ cho những lần sau."}</p>
  </form>`;
  $("login-switch").onclick=()=>loginScreen(signup?"login":"signup");
  $("login-form").onsubmit=async e=>{
    e.preventDefault();
    const msg=$("login-msg"), btn=$("login-go");
    const u=$("login-user").value.trim().toLowerCase(), pw=$("login-pass").value;
    if(!/^[a-z0-9._-]{3,30}$/.test(u)){ msg.textContent="Tên đăng nhập cần 3–30 ký tự: chữ không dấu, số, dấu chấm hoặc gạch ngang."; return; }
    if(pw.length<6){ msg.textContent="Mật khẩu cần ít nhất 6 ký tự."; return; }
    if(signup && pw!==$("login-pass2").value){ msg.textContent="Hai lần nhập mật khẩu chưa giống nhau."; return; }
    msg.textContent=""; btn.disabled=true; btn.textContent="Đang xử lý…";
    try{ signup ? await fbAuth.createUserWithEmailAndPassword(u+EMAIL_DOMAIN,pw) : await fbAuth.signInWithEmailAndPassword(u+EMAIL_DOMAIN,pw); }
    catch(err){ msg.textContent=AUTH_MSG[err.code]||("Chưa đăng nhập được ("+(err.code||err.message)+")."); btn.disabled=false; btn.textContent=signup?"Tạo tài khoản":"Đăng nhập"; }
  };
  $("login-user").focus();
}

// ---------- boot ----------
loadLocal(); buildWords(); rollDay();
if(FIREBASE_CONFIG){
  $app.innerHTML=loadingHtml("Đang mở app…");
  setTimeout(()=>{ if(!authAnswered && !authAbandoned) stuckScreen(); },8000);
  startFirebase().then(()=>{
    fbAuth.onAuthStateChanged(u=>{ if(authAbandoned) return; authAnswered=true; onUser(u); });
  }).catch(()=>{ if(!authAnswered && !authAbandoned) stuckScreen(); });
} else KID ? home() : welcome();
